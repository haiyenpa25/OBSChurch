<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyric Controller — OBSChurch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');

:root {
  --bg:      #07070f;
  --bg2:     #0f0f1e;
  --bg3:     #16162a;
  --border:  rgba(255,255,255,0.07);
  --accent:  #7c3aed;
  --accent2: #a855f7;
  --text:    #f0f0ff;
  --muted:   #6b6b8a;
  --active:  rgba(124,58,237,0.25);
  --slide-h: 52px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 50px 1fr;
  grid-template-columns: 300px 1fr 280px;
  grid-template-areas:
    "header header header"
    "left   center right";
}

/* ── HEADER ────────────────────────────────────────────────────── */
header {
  grid-area: header;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
}
header h1 {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent2);
  letter-spacing: -.01em;
}
.kbd {
  padding: 2px 6px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 10px;
  color: var(--muted);
}
.header-spacer { flex: 1; }
#btn-clear-all {
  padding: 5px 12px;
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 6px;
  color: #ef4444;
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
}
#btn-clear-all:hover { background: rgba(239,68,68,.3); }
#btn-open-display {
  padding: 5px 12px;
  background: rgba(124,58,237,.2);
  border: 1px solid rgba(124,58,237,.4);
  border-radius: 6px;
  color: var(--accent2);
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
}
#btn-open-display:hover { background: rgba(124,58,237,.35); }

/* ── LEFT: Song Picker ─────────────────────────────────────────── */
#panel-left {
  grid-area: left;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  padding: 10px 14px 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#search-box {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
#search-box select, #search-box input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
}
#search-box select:focus, #search-box input:focus {
  border-color: var(--accent);
}
#song-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
#song-list::-webkit-scrollbar { width: 4px; }
#song-list::-webkit-scrollbar-track { background: transparent; }
#song-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.song-item {
  padding: 7px 14px;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  gap: 8px;
  transition: background .15s;
  font-size: 12px;
}
.song-item:hover { background: var(--bg3); }
.song-item.selected { background: var(--active); }
.song-num {
  font-size: 10px;
  color: var(--muted);
  min-width: 26px;
  flex-shrink: 0;
}
.song-name { color: var(--text); line-height: 1.3; }
.song-author {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── CENTER: Slides ─────────────────────────────────────────────── */
#panel-center {
  grid-area: center;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
#current-song-info {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
#song-title-display {
  font-size: 14px;
  font-weight: 700;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#slide-count { font-size: 11px; color: var(--muted); }

/* Slide list */
#slides-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#slides-container::-webkit-scrollbar { width: 4px; }
#slides-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.section-label {
  padding: 4px 8px;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--accent2);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.slide-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all .15s;
  position: relative;
  font-family: 'Noto Serif', serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  white-space: pre-wrap;
  min-height: 44px;
}
.slide-card:hover {
  border-color: rgba(124,58,237,.4);
  background: var(--bg3);
}
.slide-card.active {
  border-color: var(--accent);
  background: var(--active);
  box-shadow: 0 0 0 1px var(--accent);
}
.slide-card.active::before {
  content: '▶';
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 8px;
  color: var(--accent2);
}
.slide-card.blank-slide {
  font-style: italic;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  text-align: center;
  padding: 8px;
}
.slide-idx {
  position: absolute;
  left: 6px;
  top: 6px;
  font-size: 9px;
  color: var(--muted);
  font-family: inherit;
}

/* Nav buttons */
#nav-bar {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.nav-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
.nav-btn:hover { border-color: var(--accent); background: var(--active); }
.nav-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}
.nav-btn.primary:hover { background: var(--accent2); }
#nav-info { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }

/* ── RIGHT: Settings + Preview ──────────────────────────────────── */
#panel-right {
  grid-area: right;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* Mini Preview */
#preview-wrap {
  flex-shrink: 0;
  background: #000;
  aspect-ratio: 16/9;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
#preview-canvas {
  width: 100%; height: 100%;
  position: relative;
}
#preview-text {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.4;
}
/* Drag handles */
#drag-overlay {
  position: absolute;
  inset: 0;
  cursor: crosshair;
}
#text-region {
  position: absolute;
  border: 1px dashed rgba(124,58,237,.7);
  background: rgba(124,58,237,.05);
  cursor: move;
}
#text-region .rh {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--accent2);
  border-radius: 50%;
  cursor: nwse-resize;
}
#text-region .rh-br { bottom: -4px; right: -4px; }
#text-region .rh-tr { top: -4px; right: -4px; cursor: nesw-resize; }
#text-region .rh-bl { bottom: -4px; left: -4px; cursor: nesw-resize; }
#text-region .rh-tl { top: -4px; left: -4px; cursor: nwse-resize; }

/* Settings panel */
#settings {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
#settings::-webkit-scrollbar { width: 4px; }
#settings::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.setting-group {
  margin-bottom: 12px;
}
.setting-group label {
  display: block;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin-bottom: 5px;
}
.setting-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.setting-row input[type=range] {
  flex: 1;
  accent-color: var(--accent);
}
.setting-row .val {
  font-size: 11px;
  color: var(--muted);
  min-width: 30px;
  text-align: right;
}
.ctrl {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
}
.ctrl:focus { border-color: var(--accent); }
.ctrl-row { display: flex; gap: 6px; }
.ctrl-row .ctrl { flex: 1; }
input[type=color] {
  width: 36px; height: 30px;
  padding: 2px;
  border-radius: 4px;
  background: var(--bg3);
  border: 1px solid var(--border);
  cursor: pointer;
}
.pos-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
.pos-item { display: flex; flex-direction: column; gap: 3px; }
.pos-item span { font-size: 9px; color: var(--muted); }
.pos-item input[type=number] {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 5px 7px;
  color: var(--text);
  font-size: 12px;
  outline: none;
  text-align: center;
}
.pos-item input:focus { border-color: var(--accent); }

.sep { height: 1px; background: var(--border); margin: 10px 0; }

.toggle-row {
  display: flex;
  gap: 6px;
}
.toggle-btn {
  flex: 1;
  padding: 6px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}
.toggle-btn.on {
  background: var(--active);
  border-color: var(--accent);
  color: var(--text);
}

/* Loading */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 13px;
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>🎵 Lyric Controller</h1>
  <span class="kbd">← →</span>
  <span style="font-size:10px;color:var(--muted)">Điều hướng slide</span>
  <span class="kbd">Space</span>
  <span style="font-size:10px;color:var(--muted)">Xóa màn hình</span>
  <div class="header-spacer"></div>
  <button id="btn-clear-all" onclick="clearDisplay()">⬛ Clear</button>
  <button id="btn-open-display" onclick="openDisplay()">🖥 Mở Display</button>
</header>

<!-- LEFT: Song Picker -->
<div id="panel-left">
  <div class="panel-title">Chọn Bài Hát</div>
  <div id="search-box">
    <select id="sel-collection" onchange="loadCollection()">
      <option value="">-- Tất cả --</option>
      <option value="ca-khuc-chuc-ton">Ca Khúc Chúc Tôn</option>
      <option value="thanh-ca-tin-lanh">Thánh Ca Tin Lành</option>
      <option value="ton-vinh-chua">Tôn Vinh Chúa Hằng Hữu</option>
    </select>
    <input type="text" id="search-input" placeholder="🔍 Tìm tên bài..." oninput="filterSongs()" autocomplete="off">
  </div>
  <div id="song-list"><div class="empty-state">Chọn bộ sưu tập...</div></div>
</div>

<!-- CENTER: Slides -->
<div id="panel-center">
  <div id="current-song-info">
    <div id="song-title-display" style="color:var(--muted)">Chưa chọn bài hát</div>
    <div id="slide-count"></div>
  </div>
  <div id="slides-container">
    <div class="empty-state">
      <div style="font-size:32px;margin-bottom:8px">🎵</div>
      Chọn bài hát từ danh sách bên trái<br>
      <span style="font-size:11px">Nhấn bài → xem slides → click/mũi tên để chiếu</span>
    </div>
  </div>
  <div id="nav-bar">
    <button class="nav-btn" onclick="navigate(-1)">◀ Trước</button>
    <div id="nav-info">— / —</div>
    <button class="nav-btn primary" onclick="navigate(1)">Tiếp ▶</button>
  </div>
</div>

<!-- RIGHT: Preview + Settings -->
<div id="panel-right">
  <!-- Mini Preview -->
  <div id="preview-wrap">
    <div id="preview-canvas">
      <div id="preview-text"></div>
      <div id="text-region">
        <div class="rh rh-tl" data-corner="tl"></div>
        <div class="rh rh-tr" data-corner="tr"></div>
        <div class="rh rh-bl" data-corner="bl"></div>
        <div class="rh rh-br" data-corner="br"></div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings">
    <div class="setting-group">
      <label>Font chữ</label>
      <select class="ctrl" id="s-font" onchange="updateStyle()">
        <option value="Arial">Arial</option>
        <option value="'Times New Roman'">Times New Roman</option>
        <option value="'Noto Serif'">Noto Serif</option>
        <option value="Georgia">Georgia</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Verdana">Verdana</option>
        <option value="'Segoe UI'">Segoe UI</option>
        <option value="Impact">Impact</option>
      </select>
    </div>

    <div class="setting-group">
      <label>Cỡ chữ</label>
      <div class="setting-row">
        <input type="range" id="s-size" min="12" max="120" value="48" oninput="updateStyle(); this.nextElementSibling.textContent=this.value+'px'">
        <span class="val">48px</span>
      </div>
    </div>

    <div class="setting-group">
      <label>Màu chữ & Đổ bóng</label>
      <div class="ctrl-row">
        <input type="color" id="s-color" value="#ffffff" onchange="updateStyle()">
        <input type="color" id="s-shadow-color" value="#000000" title="Màu bóng" onchange="updateStyle()">
        <div class="setting-row" style="flex:1">
          <input type="range" id="s-shadow-size" min="0" max="20" value="8" oninput="updateStyle(); this.nextElementSibling.textContent=this.value" style="width:100%">
          <span class="val">8</span>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <label>Kiểu chữ</label>
      <div class="toggle-row">
        <button class="toggle-btn on" id="tb-bold" onclick="toggleBtn(this,'bold')"><b>B</b></button>
        <button class="toggle-btn" id="tb-italic" onclick="toggleBtn(this,'italic')"><i>I</i></button>
        <button class="toggle-btn on" id="tb-align-c" onclick="setAlign('center',this)">≡</button>
        <button class="toggle-btn" id="tb-align-l" onclick="setAlign('left',this)">☰</button>
        <button class="toggle-btn" id="tb-align-r" onclick="setAlign('right',this)">⠿</button>
      </div>
    </div>

    <div class="setting-group">
      <label>Giãn dòng</label>
      <div class="setting-row">
        <input type="range" id="s-line" min="1" max="2.5" step="0.05" value="1.4" oninput="updateStyle(); this.nextElementSibling.textContent=parseFloat(this.value).toFixed(2)">
        <span class="val">1.40</span>
      </div>
    </div>

    <div class="sep"></div>

    <div class="setting-group">
      <label>Nền chữ</label>
      <div class="ctrl-row">
        <input type="color" id="s-bg-color" value="#000000" onchange="updateStyle()">
        <div class="setting-row" style="flex:1">
          <input type="range" id="s-bg-opacity" min="0" max="100" value="0" oninput="updateStyle(); this.nextElementSibling.textContent=this.value+'%'" style="width:100%">
          <span class="val">0%</span>
        </div>
      </div>
    </div>

    <div class="sep"></div>

    <div class="setting-group">
      <label>Vị trí & Kích thước hộp chữ (% màn hình)</label>
      <div class="pos-grid">
        <div class="pos-item"><span>X (%)</span><input type="number" id="p-x" value="5"  min="0" max="99" onchange="updateStyle()"></div>
        <div class="pos-item"><span>Y (%)</span><input type="number" id="p-y" value="60" min="0" max="99" onchange="updateStyle()"></div>
        <div class="pos-item"><span>Rộng (%)</span><input type="number" id="p-w" value="90" min="5" max="100" onchange="updateStyle()"></div>
        <div class="pos-item"><span>Cao (%)</span><input type="number" id="p-h" value="35" min="5" max="100" onchange="updateStyle()"></div>
      </div>
    </div>

  </div><!-- /settings -->
</div><!-- /panel-right -->

<script>
// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let allSongs   = [];
let filtered   = [];
let slides     = [];      // array of strings (text per slide)
let curSlide   = -1;
let curSong    = null;
let styleAlign = 'center';
let styleBold  = true;
let styleItalic = false;

const ch = new BroadcastChannel('obs-lyric');

// ═══════════════════════════════════════════════════
// LOAD SONGS
// ═══════════════════════════════════════════════════
async function loadCollection() {
  const col = document.getElementById('sel-collection').value;
  if (!col) { allSongs = []; renderSongList([]); return; }

  const list = document.getElementById('song-list');
  list.innerHTML = '<div class="empty-state"><div class="spinner"></div> Đang tải...</div>';

  try {
    // Load qua API
    const resp = await fetch(`api/songs.php?action=list&collection=${col}&limit=1000`);
    const data = await resp.json();
    allSongs = data.songs || [];
    filterSongs();
  } catch(e) {
    // Fallback: load JSON file
    try {
      const resp = await fetch(`data/songs-json/${col}.json`);
      const data = await resp.json();
      allSongs = data.songs || [];
      filterSongs();
    } catch(e2) {
      list.innerHTML = '<div class="empty-state" style="color:#ef4444">Lỗi tải dữ liệu</div>';
    }
  }
}

function filterSongs() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  filtered = q ? allSongs.filter(s => s.title.toLowerCase().includes(q) || String(s.number).includes(q)) : allSongs;
  renderSongList(filtered);
}

function renderSongList(songs) {
  const list = document.getElementById('song-list');
  if (!songs.length) {
    list.innerHTML = '<div class="empty-state">Không tìm thấy bài nào</div>';
    return;
  }
  list.innerHTML = songs.map((s, i) => `
    <div class="song-item" onclick="selectSong(${i})" id="si-${i}">
      <span class="song-num">${s.number}</span>
      <div>
        <div class="song-name">${s.title}</div>
        ${s.author ? `<div class="song-author">${s.author}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════
// SELECT SONG → BUILD SLIDES
// ═══════════════════════════════════════════════════
async function selectSong(idx) {
  // Highlight
  document.querySelectorAll('.song-item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('si-' + idx);
  if (el) { el.classList.add('selected'); el.scrollIntoView({ block: 'nearest' }); }

  const basic = filtered[idx];
  if (!basic) return;

  // Hiện loading
  document.getElementById('song-title-display').textContent = `⏳ Đang tải...`;
  document.getElementById('slides-container').innerHTML =
    '<div class="empty-state"><div class="spinner"></div> Đang tải lời bài hát...</div>';

  // Fetch chi tiết đầy đủ (có sections) từ API
  try {
    const resp = await fetch(`api/songs.php?action=song&id=${encodeURIComponent(basic.slug)}`);
    const data = await resp.json();
    curSong = data.song || basic;
  } catch(e) {
    // Fallback: thử load từ JSON file
    try {
      const col = basic.source_id;
      const resp = await fetch(`data/songs-json/${col}.json`);
      const data = await resp.json();
      curSong = (data.songs || []).find(s => s.slug === basic.slug || s.number === basic.number) || basic;
    } catch(e2) {
      curSong = basic;
    }
  }

  curSlide = -1;
  slides = buildSlides(curSong);

  // Update UI
  document.getElementById('song-title-display').textContent =
    `${curSong.number}. ${curSong.title}`;
  renderSlides();
}

function buildSlides(song) {
  const result = [];
  const sections = song.sections || [];

  if (!sections.length) {
    // Không có sections → dùng rawText hoặc lyrics_json
    const raw = song.rawText || '';
    const chunks = raw.split(/\n\n+/);
    chunks.forEach(chunk => {
      const t = chunk.trim();
      if (t) result.push({ label: '', text: t });
    });
    return result;
  }

  for (const sec of sections) {
    const lines = sec.lines || [];
    if (!lines.length) continue;

    // Ghép lines thành text, dùng raw text
    // Split tại blank line trong original → vì lines đã lọc blank
    // Mặc định: toàn bộ lines của section = 1 slide
    // Nếu section có nhiều lines → tách mỗi 4 dòng thành slide (tránh tràn)
    const MAX_LINES = 6; // số dòng tối đa 1 slide
    if (lines.length <= MAX_LINES) {
      result.push({ label: sec.label, text: lines.join('\n') });
    } else {
      // Tách thành nhiều slides
      for (let i = 0; i < lines.length; i += MAX_LINES) {
        const chunk = lines.slice(i, i + MAX_LINES);
        result.push({
          label: sec.label + (i > 0 ? ` (tt)` : ''),
          text: chunk.join('\n')
        });
      }
    }
  }

  return result;
}

function renderSlides() {
  const container = document.getElementById('slides-container');
  document.getElementById('slide-count').textContent = slides.length + ' slides';

  if (!slides.length) {
    container.innerHTML = '<div class="empty-state">Không có lời bài hát</div>';
    return;
  }

  let html = '';
  let lastLabel = '';

  slides.forEach((slide, i) => {
    if (slide.label !== lastLabel) {
      html += `<div class="section-label">${slide.label || 'Lời'}</div>`;
      lastLabel = slide.label;
    }
    const preview = slide.text.length > 80 ? slide.text.slice(0, 80) + '...' : slide.text;
    html += `<div class="slide-card" id="sc-${i}" onclick="goToSlide(${i})">
      <span class="slide-idx">${i+1}</span>
      ${escapeHtml(slide.text)}
    </div>`;
  });

  // Thêm slide "Trắng" ở cuối
  html += `<div class="slide-card blank-slide" onclick="clearDisplay()">⬛ Xóa màn hình</div>`;

  container.innerHTML = html;
  updateNavInfo();
}

// ═══════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════
function goToSlide(idx) {
  if (idx < 0 || idx >= slides.length) return;
  curSlide = idx;

  // Highlight
  document.querySelectorAll('.slide-card').forEach(el => el.classList.remove('active'));
  const card = document.getElementById('sc-' + idx);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Send to display
  const text = slides[idx].text;
  sendToDisplay(text);
  updateNavInfo();
  updatePreviewText(text);
}

function navigate(dir) {
  const next = curSlide + dir;
  if (next >= 0 && next < slides.length) goToSlide(next);
}

function updateNavInfo() {
  document.getElementById('nav-info').textContent =
    curSlide >= 0 ? `${curSlide + 1} / ${slides.length}` : `— / ${slides.length}`;
}

function clearDisplay() {
  curSlide = -1;
  document.querySelectorAll('.slide-card').forEach(el => el.classList.remove('active'));
  sendToDisplay('');
  updatePreviewText('');
  updateNavInfo();
}

// ═══════════════════════════════════════════════════
// BROADCAST TO DISPLAY
// ═══════════════════════════════════════════════════
function sendToDisplay(text) {
  const style = collectStyle();
  const msg = { type: 'slide', text, style };
  ch.postMessage(msg);
  // Also localStorage for cross-window sync
  try {
    localStorage.setItem('obs-lyric-state', JSON.stringify({ text, style }));
  } catch(e) {}
}

function openDisplay() {
  window.open('lyric-display.html', 'obs-display',
    'width=1280,height=720,toolbar=no,menubar=no,status=no');
}

// ═══════════════════════════════════════════════════
// STYLE SETTINGS
// ═══════════════════════════════════════════════════
function collectStyle() {
  return {
    fontFamily:  document.getElementById('s-font').value,
    fontSize:    parseInt(document.getElementById('s-size').value),
    color:       document.getElementById('s-color').value,
    shadow:      buildShadow(),
    bold:        styleBold,
    italic:      styleItalic,
    align:       styleAlign,
    lineSpacing: parseFloat(document.getElementById('s-line').value),
    bgColor:     document.getElementById('s-bg-color').value,
    bgOpacity:   parseInt(document.getElementById('s-bg-opacity').value),
    x:           parseInt(document.getElementById('p-x').value),
    y:           parseInt(document.getElementById('p-y').value),
    w:           parseInt(document.getElementById('p-w').value),
    h:           parseInt(document.getElementById('p-h').value),
  };
}

function buildShadow() {
  const c = document.getElementById('s-shadow-color').value;
  const sz = parseInt(document.getElementById('s-shadow-size').value);
  if (sz === 0) return 'none';
  const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
  return `2px 2px ${sz}px rgba(${r},${g},${b},0.9), -1px -1px ${Math.ceil(sz/2)}px rgba(${r},${g},${b},0.5)`;
}

function updateStyle() {
  const style = collectStyle();
  // Update preview
  updatePreviewBox(style);
  updatePreviewText(curSlide >= 0 ? slides[curSlide]?.text : '');
  // Send style update (text stays same)
  const curText = curSlide >= 0 ? slides[curSlide]?.text : '';
  ch.postMessage({ type: 'style', style, text: curText });
  try {
    localStorage.setItem('obs-lyric-state', JSON.stringify({ text: curText, style }));
  } catch(e) {}
}

function toggleBtn(el, prop) {
  el.classList.toggle('on');
  if (prop === 'bold') styleBold = el.classList.contains('on');
  if (prop === 'italic') styleItalic = el.classList.contains('on');
  updateStyle();
}

function setAlign(align, el) {
  styleAlign = align;
  document.querySelectorAll('[id^=tb-align]').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  updateStyle();
}

// ═══════════════════════════════════════════════════
// MINI PREVIEW
// ═══════════════════════════════════════════════════
function updatePreviewBox(style) {
  const wrap = document.getElementById('preview-wrap');
  const pw = wrap.offsetWidth;
  const ph = wrap.offsetHeight;

  const region = document.getElementById('text-region');
  region.style.left   = (style.x / 100 * pw) + 'px';
  region.style.top    = (style.y / 100 * ph) + 'px';
  region.style.width  = (style.w / 100 * pw) + 'px';
  region.style.height = (style.h / 100 * ph) + 'px';

  const pt = document.getElementById('preview-text');
  pt.style.left   = region.style.left;
  pt.style.top    = region.style.top;
  pt.style.width  = region.style.width;
  pt.style.height = region.style.height;
  const scaleFactor = pw / 1280;
  pt.style.fontSize    = (style.fontSize * scaleFactor) + 'px';
  pt.style.fontFamily  = style.fontFamily;
  pt.style.color       = style.color;
  pt.style.fontWeight  = style.bold ? 'bold' : 'normal';
  pt.style.fontStyle   = style.italic ? 'italic' : 'normal';
  pt.style.textAlign   = style.align;
  pt.style.lineHeight  = style.lineSpacing;
  pt.style.textShadow  = style.shadow;

  const bgRgba = hexToRgba(style.bgColor || '#000', (style.bgOpacity || 0) / 100);
  pt.style.background  = bgRgba;
  pt.style.display     = 'flex';
  pt.style.alignItems  = 'center';
  pt.style.justifyContent = style.align === 'center' ? 'center' : (style.align === 'right' ? 'flex-end' : 'flex-start');
  pt.style.flexDirection = 'column';
  pt.style.padding     = '4px 8px';
  pt.style.wordBreak   = 'break-word';
  pt.style.whiteSpace  = 'pre-wrap';
}

function updatePreviewText(text) {
  document.getElementById('preview-text').textContent = text || '';
}

function hexToRgba(hex, alpha) {
  if (!hex.startsWith('#')) return 'transparent';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ═══════════════════════════════════════════════════
// DRAG TEXT REGION IN PREVIEW
// ═══════════════════════════════════════════════════
(function initDrag() {
  const region = document.getElementById('text-region');
  const wrap   = document.getElementById('preview-wrap');
  let dragging = false, resizing = false, corner = '';
  let startX, startY, startRect, wrapRect;

  function getPercent(px, py) {
    const wr = wrap.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(99, (px / wr.width)  * 100)),
      y: Math.max(0, Math.min(99, (py / wr.height) * 100)),
    };
  }

  region.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('rh')) {
      resizing = true;
      corner = e.target.dataset.corner;
    } else {
      dragging = true;
    }
    startX = e.clientX; startY = e.clientY;
    wrapRect  = wrap.getBoundingClientRect();
    startRect = region.getBoundingClientRect();
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging && !resizing) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (dragging) {
      const newLeft = startRect.left - wrapRect.left + dx;
      const newTop  = startRect.top  - wrapRect.top  + dy;
      const p = getPercent(newLeft, newTop);
      document.getElementById('p-x').value = Math.round(p.x);
      document.getElementById('p-y').value = Math.round(p.y);
    }
    if (resizing) {
      if (corner.includes('r')) {
        const newW = (startRect.width + dx) / wrapRect.width * 100;
        document.getElementById('p-w').value = Math.max(5, Math.round(newW));
      }
      if (corner.includes('b')) {
        const newH = (startRect.height + dy) / wrapRect.height * 100;
        document.getElementById('p-h').value = Math.max(5, Math.round(newH));
      }
      if (corner.includes('l')) {
        const newLeft = startRect.left - wrapRect.left + dx;
        const newW = (startRect.right - wrapRect.left - newLeft) / wrapRect.width * 100;
        const p = getPercent(newLeft, 0);
        if (newW > 5) {
          document.getElementById('p-x').value = Math.round(p.x);
          document.getElementById('p-w').value = Math.round(newW);
        }
      }
      if (corner.includes('t')) {
        const newTop = startRect.top - wrapRect.top + dy;
        const newH = (startRect.bottom - wrapRect.top - newTop) / wrapRect.height * 100;
        const p = getPercent(0, newTop);
        if (newH > 5) {
          document.getElementById('p-y').value = Math.round(p.y);
          document.getElementById('p-h').value = Math.round(newH);
        }
      }
    }
    updateStyle();
  });

  document.addEventListener('mouseup', () => { dragging = false; resizing = false; });
})();

// ═══════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); navigate(1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); navigate(-1);
  } else if (e.key === ' ') {
    e.preventDefault(); clearDisplay();
  } else if (e.key === 'Home') {
    e.preventDefault(); if (slides.length) goToSlide(0);
  } else if (e.key === 'End') {
    e.preventDefault(); if (slides.length) goToSlide(slides.length - 1);
  }
});

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Init
window.addEventListener('load', () => {
  updateStyle();
  // Load default collection
  document.getElementById('sel-collection').value = 'thanh-ca-tin-lanh';
  loadCollection();
});
</script>
