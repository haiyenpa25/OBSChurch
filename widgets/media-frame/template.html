<!-- OBSChurch Widget: Media Frame / Logo -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .w-media {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    opacity: var(--opacity);
    background: var(--bg);
    box-shadow: var(--shadow);
    border: var(--border-style);
  }
  .w-media img {
    width: 100%; height: 100%;
    object-fit: var(--fit);
    display: block;
    border-radius: inherit;
  }
  .w-media-placeholder {
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding: 8px;
  }
</style>

<div class="w-media" id="w-root">
  <img id="w-img" src="" alt="" style="display:none" />
  <div class="w-media-placeholder" id="w-placeholder">⛪ LOGO</div>
</div>

<script>
(function() {
  const P = window.__WIDGET_PROPS || {
    imageUrl: '',
    fit: 'contain',
    borderRadius: 8,
    opacity: 100,
    border: false,
    borderColor: '#a855f7',
    borderWidth: 2,
    shadow: true,
    bgColor: '#111122',
    placeholder: '⛪ LOGO'
  };

  const root = document.getElementById('w-root');
  const img  = document.getElementById('w-img');
  const ph   = document.getElementById('w-placeholder');

  root.style.setProperty('--radius',  (P.borderRadius || 8) + 'px');
  root.style.setProperty('--opacity', (P.opacity || 100) / 100);
  root.style.setProperty('--bg',      P.bgColor || '#111122');
  root.style.setProperty('--fit',     P.fit || 'contain');
  root.style.setProperty('--shadow',  P.shadow ? '0 8px 24px rgba(0,0,0,0.5)' : 'none');
  root.style.setProperty('--border-style',
    P.border ? `${P.borderWidth || 2}px solid ${P.borderColor || '#a855f7'}` : 'none'
  );

  ph.textContent = P.placeholder || '⛪ LOGO';

  if (P.imageUrl) {
    img.src = P.imageUrl;
    img.style.display = 'block';
    ph.style.display = 'none';
    img.onerror = () => { img.style.display = 'none'; ph.style.display = 'flex'; };
  }
})();
</script>
