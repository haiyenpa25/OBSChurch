<!-- OBSChurch Widget: Scripture Verse -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .w-scripture {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    padding: 14px 18px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    border-radius: 8px;
  }

  /* ── Classic (viền trái) */
  .w-scripture.style-classic { border-left: 4px solid var(--accent); }
  .w-scripture.style-classic .scr-verse { font-size: var(--fs); color: var(--textColor); line-height: var(--lh); font-style: italic; }
  .w-scripture.style-classic .scr-ref   { margin-top: 8px; font-size: calc(var(--fs) * 0.75); color: var(--refColor); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }

  /* ── Centered */
  .w-scripture.style-centered { align-items: center; text-align: center; }
  .w-scripture.style-centered::before { content: '❝'; position: absolute; top: 6px; left: 12px; font-size: 40px; color: var(--accent); opacity: 0.25; font-family: serif; line-height: 1; }
  .w-scripture.style-centered .scr-verse { font-size: var(--fs); color: var(--textColor); line-height: var(--lh); font-style: italic; }
  .w-scripture.style-centered .scr-ref   { margin-top: 10px; font-size: calc(var(--fs) * 0.7); color: var(--refColor); font-weight: 700; }

  /* ── Quote */
  .w-scripture.style-quote::before { content: '"'; font-size: 80px; color: var(--accent); opacity: 0.15; position: absolute; top: -10px; left: 8px; font-family: Georgia, serif; line-height: 1; }
  .w-scripture.style-quote .scr-verse { font-size: var(--fs); color: var(--textColor); line-height: var(--lh); font-style: italic; padding-left: 16px; }
  .w-scripture.style-quote .scr-ref   { margin-top: 8px; padding-left: 16px; font-size: calc(var(--fs) * 0.7); color: var(--refColor); font-weight: 600; }

  /* ── Card */
  .w-scripture.style-card { border: 1px solid rgba(255,255,255,0.08); justify-content: space-between; }
  .w-scripture.style-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--accent); }
  .w-scripture.style-card .scr-verse { font-size: var(--fs); color: var(--textColor); line-height: var(--lh); flex: 1; }
  .w-scripture.style-card .scr-ref   { background: var(--accent); color: #fff; display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: calc(var(--fs) * 0.7); font-weight: 700; margin-top: 10px; }

  .scr-trans { font-size: calc(var(--fs) * 0.65); color: rgba(255,255,255,0.3); font-family: monospace; margin-left: 6px; font-style: normal; }
</style>

<div class="w-scripture" id="w-root">
  <div class="scr-verse" id="scr-verse">Vì Đức Chúa Trời yêu thương thế gian...</div>
  <div class="scr-ref" id="scr-ref">
    <span id="scr-ref-text">Giăng 3:16</span>
    <span class="scr-trans" id="scr-trans">TTHĐ</span>
  </div>
</div>

<script>
(function() {
  const P = window.__WIDGET_PROPS || {
    verse: 'Vì Đức Chúa Trời yêu thương thế gian đến nỗi đã ban Con một của Ngài...',
    reference: 'Giăng 3:16',
    translation: 'TTHĐ',
    textColor: '#ffffff',
    refColor: '#a855f7',
    bgColor: '#0a0a18',
    bgOpacity: 90,
    fontSize: 16,
    lineHeight: 1.6,
    accentColor: '#a855f7',
    style: 'classic',
    showTrans: true
  };

  const root    = document.getElementById('w-root');
  const verseEl = document.getElementById('scr-verse');
  const refEl   = document.getElementById('scr-ref-text');
  const transEl = document.getElementById('scr-trans');

  // bg color with opacity
  function hexToRgba(hex, alpha) {
    if (!hex || hex.length < 7) return `rgba(10,10,24,${alpha})`;
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  root.style.setProperty('--bg',        hexToRgba(P.bgColor||'#0a0a18', (P.bgOpacity||90)/100));
  root.style.setProperty('--textColor', P.textColor || '#fff');
  root.style.setProperty('--refColor',  P.refColor  || '#a855f7');
  root.style.setProperty('--accent',    P.accentColor || '#a855f7');
  root.style.setProperty('--fs',        (P.fontSize || 16) + 'px');
  root.style.setProperty('--lh',        P.lineHeight || 1.6);

  root.className = `w-scripture style-${P.style || 'classic'}`;
  verseEl.textContent = P.verse || '';
  refEl.textContent   = P.reference || '';
  transEl.textContent = P.translation || '';
  transEl.style.display = P.showTrans !== false ? '' : 'none';
})();
</script>
