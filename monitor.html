<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confidence Monitor — OBSChurch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#010108;--s1:#06061a;--s2:#0c0c24;--s3:#12122e;
  --bd:rgba(255,255,255,0.07);--bdd:rgba(255,255,255,0.03);
  --red:#ef4444;--rg:rgba(239,68,68,0.15);
  --green:#4edea3;--gg:rgba(78,222,163,0.12);--gp:rgba(78,222,163,0.3);
  --blue:#4d8eff;--purple:#a855f7;--amber:#f59e0b;
  --t1:#ffffff;--t2:#c0c0e0;--t3:#6060a0;--t4:#2a2a50;
  --f:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);font-family:var(--f);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden}
.ms{font-family:'Material Symbols Outlined';font-style:normal;font-size:inherit;line-height:1}

/* ── SHELL ── */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;max-height:100vh}

/* ── STATUS BAR ── */
#status-bar{
  display:flex;align-items:center;gap:10px;padding:8px 16px;
  background:var(--s1);border-bottom:1px solid var(--bd);
  font-size:11px;font-family:var(--fm);flex-shrink:0;
}
.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--t4);flex-shrink:0;transition:all 0.3s}
.sb-dot.on{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.6);animation:pulse 1.2s ease-in-out infinite}
.sb-dot.ws{background:var(--green);box-shadow:0 0 6px var(--green)}
.sb-dot.ws-err{background:var(--red)}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(239,68,68,0.5)}50%{box-shadow:0 0 18px rgba(239,68,68,0.9),0 0 28px rgba(239,68,68,0.3)}}
#live-badge{display:flex;align-items:center;gap:6px}
#live-badge.on .sb-dot{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.6);animation:pulse 1.2s ease-in-out infinite}
.badge-text{font-weight:800;letter-spacing:0.12em;font-size:10px;color:var(--t3);text-transform:uppercase}
.badge-text.on{color:var(--red)}
.sb-sep{width:1px;height:14px;background:var(--bd);flex-shrink:0}
#clock{margin-left:auto;font-size:18px;font-weight:700;color:var(--t2);letter-spacing:0.04em;font-family:var(--fm)}
#ws-status{display:flex;align-items:center;gap:5px;color:var(--t3);font-size:10px}
#scene-info{color:var(--t3);font-size:9px;letter-spacing:0.06em;text-transform:uppercase}

/* ── MAIN ── */
#main{display:grid;grid-template-rows:1fr 1px auto;overflow:hidden;padding:0}

/* ON-AIR zone */
#zone-live{
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  padding:32px 40px 24px;
  background:linear-gradient(to bottom right,rgba(239,68,68,0.04),transparent);
  position:relative;overflow:hidden;
}
#zone-live::before{
  content:'ON AIR';position:absolute;right:32px;top:20px;
  font-size:72px;font-weight:900;color:rgba(239,68,68,0.04);
  font-family:var(--fm);letter-spacing:0.1em;pointer-events:none;
}
.zone-tag{font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.zone-tag.red{color:var(--red)}
.zone-tag.next{color:var(--t4);margin-bottom:8px;margin-top:0}
.tag-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
#live-current{
  font-size:clamp(28px,4vw,56px);font-weight:800;line-height:1.2;
  color:#fff;text-shadow:0 0 40px rgba(239,68,68,0.2);
  min-height:1.4em;transition:all 0.3s;
  word-break:break-word;max-width:900px;
}
#live-current.empty{color:var(--t4);font-weight:400;font-size:clamp(20px,2.5vw,36px)}
.live-meta{margin-top:10px;font-size:11px;color:var(--t3);font-family:var(--fm);display:flex;gap:12px}

/* Divider */
.zone-div{height:1px;background:linear-gradient(to right,rgba(239,68,68,0.3),transparent);flex-shrink:0}

/* NEXT zone */
#zone-next{
  padding:20px 40px;display:flex;flex-direction:column;justify-content:center;
  background:rgba(0,0,0,0.3);
  position:relative;overflow:hidden;
}
#live-next{
  font-size:clamp(16px,2.5vw,30px);font-weight:500;color:var(--t3);
  transition:all 0.3s;word-break:break-word;max-width:900px;line-height:1.4;
}
#live-next.has-next{color:var(--t2)}
#live-next.empty{color:var(--t4);font-style:italic;font-size:14px}

/* ── CONTROLS ── */
#controls{
  display:flex;align-items:center;gap:8px;padding:12px 16px;
  background:var(--s1);border-top:1px solid var(--bd);flex-shrink:0;
  flex-wrap:wrap;
}
.ctrl-group{display:flex;gap:6px;align-items:center}
.ctrl-sep{width:1px;height:28px;background:var(--bd);flex-shrink:0}
.ctrl-btn{
  height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--bd);
  background:var(--s2);color:var(--t2);font-size:12px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:all 0.15s;
  font-family:var(--f);font-weight:600;
}
.ctrl-btn:hover{background:var(--s3);color:var(--t1);border-color:rgba(255,255,255,0.12)}
.ctrl-btn .ms{font-size:18px}
.ctrl-btn.push-btn{
  background:linear-gradient(135deg,#059669,var(--green));border-color:transparent;
  color:#fff;font-size:13px;min-width:130px;justify-content:center;
  box-shadow:0 0 16px rgba(78,222,163,0.2);
}
.ctrl-btn.push-btn:hover{box-shadow:0 0 24px rgba(78,222,163,0.4);transform:translateY(-1px)}
.ctrl-btn.push-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none;background:var(--s2);border-color:var(--bd)}
.ctrl-btn.clear-btn{color:var(--red);border-color:rgba(239,68,68,0.2)}
.ctrl-btn.clear-btn:hover{background:var(--rg);border-color:rgba(239,68,68,0.4)}
.kbd-hint{font-size:9px;font-family:var(--fm);color:var(--t4);background:var(--s3);padding:1px 4px;border-radius:3px;margin-left:2px}

/* Timeline strip */
#timeline-strip{
  flex:1;display:flex;gap:4px;overflow-x:auto;align-items:center;padding:0 4px;
}
#timeline-strip::-webkit-scrollbar{height:2px}
#timeline-strip::-webkit-scrollbar-thumb{background:var(--bd)}
.tl-item{
  height:28px;padding:0 10px;border-radius:5px;border:1px solid var(--bd);
  background:var(--s3);font-size:9px;color:var(--t3);white-space:nowrap;
  flex-shrink:0;display:flex;align-items:center;gap:4px;cursor:pointer;
  transition:all 0.12s;
}
.tl-item:hover{background:var(--s2);color:var(--t2)}
.tl-item.done{color:var(--t4);text-decoration:line-through}
.tl-item.live{border-color:var(--red);color:var(--red);background:var(--rg)}
.tl-item.next-up{border-color:var(--green);color:var(--green);background:var(--gg)}

/* Song name overlay */
#song-badge{
  position:absolute;bottom:16px;right:20px;font-size:9px;font-family:var(--fm);
  color:var(--t4);letter-spacing:0.06em;max-width:300px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}

/* Overlay mode indicator */
#mode-badge{
  position:absolute;top:16px;left:36px;display:flex;align-items:center;gap:4px;
  font-size:8px;font-family:var(--fm);color:var(--t4);letter-spacing:0.1em;
  text-transform:uppercase;
}
#mode-badge .mode-dot{width:5px;height:5px;border-radius:50%;background:var(--t4)}

/* Toast */
#toast-box{position:fixed;top:60px;right:16px;z-index:9999;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.toast{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:7px 12px;font-size:10px;font-family:var(--fm);color:var(--t2);opacity:0;transform:translateY(-6px);transition:opacity 0.2s,transform 0.2s}
.toast.show{opacity:1;transform:none}
.toast.ok{border-color:var(--gp);color:var(--green)}
.toast.err{border-color:rgba(239,68,68,0.4);color:var(--red)}
.toast.inf{border-color:rgba(77,142,255,0.3);color:var(--blue)}

/* Fullscreen hint */
#fs-hint{position:fixed;bottom:70px;right:16px;font-size:8px;font-family:var(--fm);color:var(--t4);cursor:pointer;transition:color 0.2s}
#fs-hint:hover{color:var(--t3)}
</style>
</head>
<body>
<div id="toast-box"></div>
<div id="fs-hint" onclick="toggleFS()" title="Fullscreen">⛶ F11</div>

<div id="app">
  <!-- STATUS BAR -->
  <div id="status-bar">
    <div id="live-badge">
      <div class="sb-dot" id="live-dot"></div>
      <span class="badge-text" id="live-badge-txt">OFFLINE</span>
    </div>
    <div class="sb-sep"></div>
    <div id="scene-info" id="scene-info">—</div>
    <div class="sb-sep"></div>
    <div id="ws-status">
      <div class="sb-dot" id="ws-dot"></div>
      <span id="ws-lbl">Đang kết nối...</span>
    </div>
    <div id="clock">00:00:00</div>
  </div>

  <!-- MAIN DISPLAY -->
  <div id="main">
    <!-- ON AIR -->
    <div id="zone-live">
      <div id="mode-badge"><div class="mode-dot"></div><span id="mode-txt">—</span></div>
      <div class="zone-tag red"><div class="tag-dot"></div> Đang Phát</div>
      <div id="live-current" class="empty">Chưa có nội dung</div>
      <div class="live-meta">
        <span id="song-meta">—</span>
        <span id="section-meta"></span>
      </div>
      <div id="song-badge"></div>
    </div>

    <div class="zone-div"></div>

    <!-- NEXT -->
    <div id="zone-next">
      <div class="zone-tag next"><div class="tag-dot"></div> Tiếp Theo</div>
      <div id="live-next" class="empty">—</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div id="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn" id="btn-prev" title="Dòng trước [←]">
        <span class="ms">arrow_back</span> Trước <span class="kbd-hint">←</span>
      </button>
      <button class="ctrl-btn push-btn" id="btn-push" disabled title="Phát dòng đang chọn [Space]">
        <span class="ms">send</span> PHÁT <span class="kbd-hint">Space</span>
      </button>
      <button class="ctrl-btn" id="btn-next" title="Dòng tiếp [→]">
        Tiếp <span class="ms">arrow_forward</span> <span class="kbd-hint">→</span>
      </button>
    </div>

    <div class="ctrl-sep"></div>

    <div id="timeline-strip" id="timeline-strip"></div>

    <div class="ctrl-sep"></div>

    <div class="ctrl-group">
      <button class="ctrl-btn clear-btn" id="btn-clear" title="Tắt overlay [Esc]">
        <span class="ms">visibility_off</span> Tắt <span class="kbd-hint">Esc</span>
      </button>
      <a href="lyrics.html" class="ctrl-btn" style="text-decoration:none;font-size:11px">
        <span class="ms">lyrics</span> Lyrics
      </a>
      <a href="index.html" class="ctrl-btn" style="text-decoration:none;font-size:11px">
        <span class="ms">dashboard</span>
      </a>
    </div>
  </div>
</div>

<script>
const WS_URL = 'ws://localhost:3001';
const API    = 'http://localhost:3001';
const $      = id => document.getElementById(id);

/* ── State ─────────────────────────────────────────────── */
const S = {
  ws:         null,
  isLive:     false,
  liveText:   '',
  nextText:   '',
  songName:   '',
  section:    '',
  modeLabel:  '',
  flatLines:  [],   // mirrored from lyrics station via WS
  liveIdx:    -1,
  wsOk:       false,
};

/* ── Clock ──────────────────────────────────────────────── */
function startClock() {
  const tick = () => {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  };
  tick();
  setInterval(tick, 1000);
}

/* ── WebSocket ──────────────────────────────────────────── */
function connectWS() {
  S.ws = new WebSocket(WS_URL);

  S.ws.addEventListener('open', () => {
    S.wsOk = true;
    $('ws-dot').className = 'sb-dot ws';
    $('ws-lbl').textContent = 'WS ✓';
    toast('Đã kết nối WS Hub', 'ok');
    // Request current state
    S.ws.send(JSON.stringify({ type: 'REQUEST_STATE' }));
  });

  S.ws.addEventListener('message', e => {
    try { handleMsg(JSON.parse(e.data)); } catch(_) {}
  });

  S.ws.addEventListener('close', () => {
    S.wsOk = false;
    $('ws-dot').className = 'sb-dot ws-err';
    $('ws-lbl').textContent = 'Mất kết nối';
    setTimeout(connectWS, 3000);
  });

  S.ws.addEventListener('error', () => S.ws.close());
}

function sendWS(msg) {
  if (S.ws?.readyState === 1) S.ws.send(JSON.stringify(msg));
}

/* ── Message Handler ────────────────────────────────────── */
function handleMsg(msg) {
  switch (msg.type) {
    case 'OVERLAY_SHOW':
      showLive(msg.payload);
      break;

    case 'OVERLAY_HIDE':
      clearDisplay();
      break;

    case 'STATE_SYNC':
      if (msg.payload.overlayVisible === false) clearDisplay();
      break;

    case 'OBS_SCENE_CHANGED':
      $('scene-info').textContent = `Scene: ${msg.payload.scene || '—'}`;
      break;

    case 'MONITOR_LINES':
      // Lyric Station can broadcast its flat lines for timeline
      S.flatLines = msg.payload.lines || [];
      S.liveIdx   = msg.payload.liveIdx ?? -1;
      renderTimeline();
      break;
  }
}

/* ── Display Update ─────────────────────────────────────── */
function showLive(payload) {
  const primary   = payload.primary   || '';
  const secondary = payload.secondary || '';
  const song      = payload.songName  || '';
  const section   = payload.sectionLabel || '';
  const tpl       = payload.templateId || payload.themeId || '';

  S.isLive    = true;
  S.liveText  = primary;
  S.nextText  = secondary;
  S.songName  = song;
  S.section   = section;
  S.modeLabel = getModeLabel(payload);

  // ON-AIR zone
  const curEl = $('live-current');
  curEl.textContent = primary || '—';
  curEl.classList.toggle('empty', !primary);

  // NEXT zone
  const nxtEl = $('live-next');
  nxtEl.textContent = secondary || '—';
  nxtEl.classList.toggle('has-next', !!secondary);
  nxtEl.classList.toggle('empty', !secondary);

  // Metadata
  $('song-meta').textContent    = song ? `🎵 ${song}` : '—';
  $('section-meta').textContent = section;
  $('song-badge').textContent   = tpl;
  $('mode-txt').textContent     = S.modeLabel;

  // Badge
  $('live-dot').className = 'sb-dot on';
  $('live-badge-txt').textContent = 'LIVE';
  $('live-badge-txt').className   = 'badge-text on';

  // Enable push
  $('btn-push').disabled = false;

  // Flash effect
  $('zone-live').style.boxShadow = '0 0 30px rgba(239,68,68,0.15) inset';
  setTimeout(() => { $('zone-live').style.boxShadow = ''; }, 600);
}

function clearDisplay() {
  S.isLive   = false;
  S.liveText = '';
  S.nextText = '';

  const curEl = $('live-current');
  curEl.textContent = 'Chưa có nội dung';
  curEl.className   = 'empty';

  const nxtEl = $('live-next');
  nxtEl.textContent = '—';
  nxtEl.className   = 'empty';

  $('song-meta').textContent    = '—';
  $('section-meta').textContent = '';
  $('song-badge').textContent   = '';
  $('mode-txt').textContent     = '—';

  $('live-dot').className        = 'sb-dot';
  $('live-badge-txt').textContent = 'OFFLINE';
  $('live-badge-txt').className   = 'badge-text';
  $('btn-push').disabled = true;
}

function getModeLabel(payload) {
  if (payload.themeId)  return `Theme: ${payload.themeId}`;
  const tpl = payload.templateId || '';
  const map = {
    'lyric-clean':     'Lower Third',
    'lyric-fullscreen':'Fullscreen',
    'lyric-dark':      'Subtitle',
    'lyric-minimal':   'Side Panel',
    'scripture-fullscreen': 'Scripture',
    'glassmorphism':   'Glassmorphism',
    'scifi':           'Sci-Fi',
    'vintage':         'Vintage',
  };
  return map[tpl] || tpl || '—';
}

/* ── Timeline ───────────────────────────────────────────── */
function renderTimeline() {
  const strip = $('timeline-strip');
  if (!S.flatLines.length) {
    strip.innerHTML = '<span style="font-size:9px;color:var(--t4);font-family:var(--fm)">Không có timeline</span>';
    return;
  }
  strip.innerHTML = S.flatLines.map((ln, i) => {
    const cls = i < S.liveIdx ? 'tl-item done'
              : i === S.liveIdx ? 'tl-item live'
              : i === S.liveIdx + 1 ? 'tl-item next-up'
              : 'tl-item';
    const icon = i < S.liveIdx ? '✓ ' : i === S.liveIdx ? '▶ ' : '';
    return `<div class="${cls}" data-i="${i}">${icon}${ln.text?.slice(0, 28) || '—'}</div>`;
  }).join('');
  strip.querySelectorAll('.tl-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = +el.dataset.i;
      sendWS({ type: 'MONITOR_SELECT', payload: { lineIdx: idx } });
      toast(`Chọn dòng ${idx + 1}`, 'inf');
    });
  });
}

/* ── Control Actions ────────────────────────────────────── */
function doPrev() { sendWS({ type: 'MONITOR_NAV', payload: { dir: -1 } }); }
function doNext() { sendWS({ type: 'MONITOR_NAV', payload: { dir:  1 } }); }
function doPush() {
  if (S.isLive) {
    sendWS({ type: 'MONITOR_PUSH', payload: {} });
    toast('▶ Push lại', 'ok');
  }
}
function doClear() {
  sendWS({ type: 'OVERLAY_HIDE', payload: {} });
  clearDisplay();
  toast('Overlay tắt', 'inf');
}

/* ── Keyboard ───────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowLeft'  || e.key === 'F6')   { e.preventDefault(); doPrev(); }
  if (e.key === 'ArrowRight' || e.key === 'F7')   { e.preventDefault(); doNext(); }
  if (e.key === ' ')                               { e.preventDefault(); doPush(); }
  if (e.key === 'Escape')                          { e.preventDefault(); doClear(); }
  if (e.key === 'F11')                             { e.preventDefault(); toggleFS(); }
});

/* ── Bind ───────────────────────────────────────────────── */
$('btn-prev').addEventListener('click',  doPrev);
$('btn-next').addEventListener('click',  doNext);
$('btn-push').addEventListener('click',  doPush);
$('btn-clear').addEventListener('click', doClear);

/* ── Fullscreen ─────────────────────────────────────────── */
function toggleFS() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

/* ── Toast ──────────────────────────────────────────────── */
function toast(msg, type = 'inf') {
  const b = $('toast-box');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  b.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 2500);
}

/* ── Boot ───────────────────────────────────────────────── */
startClock();
connectWS();
clearDisplay();
</script>
</body>
</html>
