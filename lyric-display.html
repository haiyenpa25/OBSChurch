<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lyric Display — OBS Source</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
}
#canvas {
  position: relative;
  width: 100vw; height: 100vh;
  background: transparent;
}
#textbox {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease;
  pointer-events: none;
  word-break: break-word;
  white-space: pre-wrap;
  line-height: 1.4;
  text-align: center;
}
#textbox.fade-out { opacity: 0; }
#textbox.fade-in  { opacity: 1; }

/* Debug border khi mở từ controller */
body.debug #textbox {
  outline: 2px dashed rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<div id="canvas">
  <div id="textbox" class="fade-in"></div>
</div>

<script>
const box = document.getElementById('textbox');
const DEFAULT = {
  text: '',
  x: 5, y: 60, w: 90, h: 35,
  fontSize: 48,
  fontFamily: 'Arial',
  color: '#ffffff',
  shadow: '2px 2px 8px rgba(0,0,0,0.9)',
  bold: true,
  bgColor: 'transparent',
  bgOpacity: 0,
  align: 'center',
  lineSpacing: 1.4,
};

let state = { ...DEFAULT };

function applyState(s) {
  box.style.left   = s.x + '%';
  box.style.top    = s.y + '%';
  box.style.width  = s.w + '%';
  box.style.height = s.h + '%';
  box.style.fontSize   = s.fontSize + 'px';
  box.style.fontFamily = s.fontFamily;
  box.style.color      = s.color;
  box.style.textShadow = s.shadow;
  box.style.fontWeight = s.bold ? 'bold' : 'normal';
  box.style.textAlign  = s.align;
  box.style.lineHeight = s.lineSpacing;
  const bgRgba = hexToRgba(s.bgColor || '#000000', (s.bgOpacity || 0) / 100);
  box.style.background = bgRgba;
  box.style.borderRadius = '4px';
  box.style.padding = '8px 16px';
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function updateText(text) {
  if (!text || text.trim() === '') {
    box.classList.remove('fade-in');
    box.classList.add('fade-out');
    return;
  }
  box.classList.remove('fade-in');
  box.classList.add('fade-out');
  setTimeout(() => {
    box.textContent = text;
    box.classList.remove('fade-out');
    box.classList.add('fade-in');
  }, 280);
}

// ── Nhận dữ liệu từ Controller qua BroadcastChannel ──────────────
const ch = new BroadcastChannel('obs-lyric');
ch.onmessage = (e) => {
  const msg = e.data;
  if (msg.type === 'slide') {
    updateText(msg.text);
  }
  if (msg.type === 'style') {
    Object.assign(state, msg.style);
    applyState(state);
    // Re-apply text if already showing
    if (msg.text !== undefined) updateText(msg.text);
  }
  if (msg.type === 'clear') {
    updateText('');
  }
};

// ── Init từ localStorage ──────────────────────────────────────────
function loadFromStorage() {
  try {
    const saved = localStorage.getItem('obs-lyric-state');
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(state, data.style || {});
      applyState(state);
      if (data.text !== undefined) {
        box.textContent = data.text;
        box.classList.add('fade-in');
      }
    } else {
      applyState(state);
    }
  } catch(e) {}
}

// ── Storage sync (cho trường hợp khác tab) ────────────────────────
window.addEventListener('storage', (e) => {
  if (e.key === 'obs-lyric-state') {
    try {
      const data = JSON.parse(e.newValue);
      Object.assign(state, data.style || {});
      applyState(state);
      updateText(data.text || '');
    } catch(err) {}
  }
});

loadFromStorage();

// Debug mode nếu có ?debug
if (location.search.includes('debug')) {
  document.body.classList.add('debug');
}
</script>
</body>
</html>
