<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene Types — OBSChurch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --f:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',monospace;
  --b0:#04040c;--b1:#08081a;--b2:#0e0e22;--b3:#141430;--b4:#1a1a3a;
  --bd:rgba(255,255,255,0.08);--bdd:rgba(255,255,255,0.04);
  --p:#a855f7;--pd:rgba(168,85,247,0.15);--pp:rgba(168,85,247,0.3);
  --b:#4d8eff;--bd2:rgba(77,142,255,0.15);
  --g:#4edea3;--gd:rgba(78,222,163,0.15);
  --a:#fbbf24;--ad:rgba(251,191,36,0.15);
  --r:#ef4444;--rd:rgba(239,68,68,0.15);
  --t1:#f0f0ff;--t2:#9090b0;--t3:#505070;--t4:#2a2a48;
}
html,body{height:100%;background:var(--b0);font-family:var(--f);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--f);cursor:pointer}
input,select,textarea{font-family:var(--f)}

/* ── SHELL ── */
#app{display:grid;grid-template-rows:48px 1fr;height:100vh}

/* ── TOPBAR ── */
#topbar{background:rgba(4,4,12,0.97);border-bottom:1px solid var(--bd);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100}
.brand{display:flex;align-items:center;gap:8px}
.brand-logo{width:28px;height:28px;background:linear-gradient(135deg,var(--p),#6d28d9);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.brand-name{font-size:12px;font-weight:800;letter-spacing:0.05em}
.brand-name em{color:var(--p);font-style:normal}
.tb-sep{width:1px;height:18px;background:var(--bd)}
.tb-btn{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-size:10px;transition:all 0.15s;text-decoration:none;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,0.07);color:var(--t1)}
.tb-btn .ms{font-size:13px;font-family:'Material Symbols Outlined'}
.tb-btn.save{background:linear-gradient(135deg,var(--p),#6d28d9);border-color:transparent;color:#fff;box-shadow:0 0 10px rgba(168,85,247,0.3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}

/* ── WORKSPACE ── */
#workspace{display:grid;grid-template-columns:220px 1fr 320px;overflow:hidden}

/* ── LEFT: Scene Type List ── */
#panel-st-list{background:var(--b1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.st-list-hdr{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}
.st-list-hdr-title{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:0.08em;flex:1}
.btn-add-st{height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--t3);font-size:10px;display:flex;align-items:center;gap:3px;transition:all 0.15s}
.btn-add-st:hover{background:var(--pd);color:var(--p);border-color:var(--pp)}
.btn-add-st .ms{font-size:12px;font-family:'Material Symbols Outlined'}
.st-list{flex:1;overflow-y:auto;padding:6px}
.st-list::-webkit-scrollbar{width:3px}
.st-list::-webkit-scrollbar-thumb{background:var(--bd)}
.st-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:all 0.12s;margin-bottom:2px}
.st-item:hover{background:rgba(255,255,255,0.04)}
.st-item.active{background:var(--pd);border-color:var(--pp)}
.st-icon{font-size:16px;flex-shrink:0}
.st-info{flex:1;min-width:0}
.st-name{font-size:11px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-desc{font-size:8px;color:var(--t3);font-family:var(--fm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.st-del{width:18px;height:18px;border-radius:4px;border:none;background:transparent;color:var(--t4);font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.12s}
.st-del:hover{background:var(--rd);color:var(--r)}
.st-del .ms{font-size:12px;font-family:'Material Symbols Outlined'}

/* ── CENTER: Editor ── */
#panel-editor{overflow-y:auto;background:var(--b0);padding:16px;display:flex;flex-direction:column;gap:14px}
#panel-editor::-webkit-scrollbar{width:4px}
#panel-editor::-webkit-scrollbar-thumb{background:var(--bd)}
.editor-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--t4);font-size:12px;font-family:var(--fm);text-align:center;flex-direction:column;gap:8px}
.editor-empty .big-icon{font-size:40px}

/* ── Editor Sections ── */
.ed-section{background:var(--b2);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.ed-hdr{padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--b3);display:flex;align-items:center;gap:8px}
.ed-hdr-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.ed-hdr-icon.p{background:var(--pd);color:var(--p)}
.ed-hdr-icon.g{background:var(--gd);color:var(--g)}
.ed-hdr-icon.b{background:var(--bd2);color:var(--b)}
.ed-hdr-icon.a{background:var(--ad);color:var(--a)}
.ed-hdr-title{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:0.08em;flex:1}
.ed-body{padding:12px}
.ed-add-btn{height:26px;padding:0 10px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--t3);font-size:10px;display:flex;align-items:center;gap:4px;transition:all 0.12s;flex-shrink:0}
.ed-add-btn:hover{background:var(--gd);color:var(--g);border-color:rgba(78,222,163,0.3)}
.ed-add-btn .ms{font-size:12px;font-family:'Material Symbols Outlined'}

/* ── Meta fields ── */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.flbl{font-size:9px;color:var(--t3);font-family:var(--fm);text-transform:uppercase;letter-spacing:0.06em}
.finput{height:28px;padding:0 9px;border-radius:5px;border:1px solid var(--bd);background:var(--b1);color:var(--t1);font-size:11px;transition:border-color 0.15s;outline:none}
.finput:focus{border-color:var(--p)}
textarea.finput{height:60px;padding:7px 9px;resize:vertical}

/* ── Inputs list ── */
.input-list{display:flex;flex-direction:column;gap:6px}
.input-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--b1);border:1px solid var(--bd);border-radius:7px}
.input-icon{font-size:16px;flex-shrink:0;width:24px;text-align:center}
.input-info{flex:1;min-width:0}
.input-label{font-size:11px;font-weight:600;color:var(--t1)}
.input-sub{font-size:8px;color:var(--t3);font-family:var(--fm);margin-top:1px}
.input-type-badge{font-size:8px;padding:1px 6px;border-radius:8px;font-family:var(--fm);flex-shrink:0}
.input-type-badge.obs{background:rgba(77,142,255,0.15);color:var(--b);border:1px solid rgba(77,142,255,0.3)}
.input-type-badge.widget{background:var(--pd);color:var(--p);border:1px solid var(--pp)}
.input-del{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--t4);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s}
.input-del:hover{background:var(--rd);color:var(--r)}
.input-del .ms{font-size:13px;font-family:'Material Symbols Outlined'}

/* ── Data fields list ── */
.df-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.df-item{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--b1);border:1px solid var(--bd);border-radius:5px;font-size:10px;color:var(--t2)}
.df-item .ms{font-size:12px;font-family:'Material Symbols Outlined';color:var(--t3)}
.df-key{font-family:var(--fm);font-size:9px;color:var(--p);flex-shrink:0}
.df-del{margin-left:auto;width:16px;height:16px;border:none;background:transparent;color:var(--t4);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.df-del:hover{color:var(--r)}
.df-del .ms{font-size:11px;font-family:'Material Symbols Outlined'}

/* ── Overlays ── */
.overlay-list{display:flex;flex-direction:column;gap:6px}
.overlay-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--b1);border:1px solid var(--bd);border-radius:7px;cursor:pointer;transition:all 0.12s}
.overlay-item:hover{border-color:rgba(255,255,255,0.15)}
.overlay-item.active{background:var(--pd);border-color:var(--pp)}
.ov-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center}
.ov-info{flex:1;min-width:0}
.ov-label{font-size:11px;font-weight:600;color:var(--t1)}
.ov-desc{font-size:8px;color:var(--t3);font-family:var(--fm);margin-top:1px}
.ov-layers-count{font-size:8px;color:var(--t3);font-family:var(--fm);flex-shrink:0}
.ov-del{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--t4);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s}
.ov-del:hover{background:var(--rd);color:var(--r)}
.ov-del .ms{font-size:13px;font-family:'Material Symbols Outlined'}

/* ── RIGHT: Overlay Canvas ── */
#panel-right{background:var(--b1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.rp-hdr{padding:10px 14px;border-bottom:1px solid var(--bd);font-size:10px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:6px;flex-shrink:0}
.rp-hdr .ms{font-size:14px;font-family:'Material Symbols Outlined';color:var(--p)}
.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,var(--b2) 0%,var(--b0) 100%)}
.mini-canvas{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.8)}
.mc-el{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.2);cursor:move;user-select:none;transition:border-color 0.1s}
.mc-el:hover{border-color:rgba(255,255,255,0.4)}
.mc-el.selected{border:2px solid var(--p);box-shadow:0 0 0 1px var(--p)}
.mc-el-label{font-size:9px;font-family:var(--fm);color:rgba(255,255,255,0.7);text-align:center;pointer-events:none;padding:2px 4px}
.mc-el-icon{font-size:20px;pointer-events:none}
.rh-mc{position:absolute;width:8px;height:8px;background:var(--p);border:1px solid #000;border-radius:1px;cursor:nwse-resize}
.rh-mc.tl{top:-4px;left:-4px;cursor:nw-resize}
.rh-mc.tr{top:-4px;right:-4px;cursor:ne-resize}
.rh-mc.bl{bottom:-4px;left:-4px;cursor:sw-resize}
.rh-mc.br{bottom:-4px;right:-4px;cursor:se-resize}
.canvas-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--t4);font-size:10px;font-family:var(--fm);text-align:center}

/* Layer controls in right panel */
.rp-layers{padding:10px 12px;border-top:1px solid var(--bd);flex-shrink:0;max-height:200px;overflow-y:auto}
.rp-layers-title{font-size:8px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
.rp-layer-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;transition:all 0.1s;margin-bottom:2px}
.rp-layer-row:hover{background:rgba(255,255,255,0.04)}
.rp-layer-row.selected{background:var(--pd)}
.rp-layer-dot{width:8px;height:8px;border-radius:50%;background:var(--t4);flex-shrink:0}
.rp-layer-row.selected .rp-layer-dot{background:var(--p)}
.rp-layer-name{font-size:10px;color:var(--t2);flex:1}
.rp-layer-vis{width:16px;height:16px;border:none;background:transparent;color:var(--t3);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.rp-layer-vis .ms{font-size:13px;font-family:'Material Symbols Outlined'}

/* ── MODALS ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:9000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-box{background:var(--b2);border:1px solid var(--bd);border-radius:12px;width:480px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.9);transform:translateY(10px);transition:transform 0.2s}
.modal-bg.open .modal-box{transform:translateY(0)}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:13px;font-weight:700}
.modal-close{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;line-height:1}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal-footer{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.mbtn{height:30px;padding:0 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.15s}
.mbtn.primary{background:linear-gradient(135deg,var(--p),#6d28d9);border:none;color:#fff}
.mbtn.cancel{background:transparent;border:1px solid var(--bd);color:var(--t2)}
.mbtn.cancel:hover{background:rgba(255,255,255,0.06)}
.input-type-tabs{display:flex;gap:6px;margin-bottom:4px}
.it-tab{flex:1;height:60px;border-radius:8px;border:1px solid var(--bd);background:var(--b1);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all 0.15s}
.it-tab:hover{border-color:rgba(255,255,255,0.2)}
.it-tab.active{background:var(--pd);border-color:var(--pp);color:var(--p)}
.it-tab-icon{font-size:20px}

/* ── Toast ── */
#toast-box{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:9999;pointer-events:none}
.toast{background:var(--b3);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;font-size:10px;font-family:var(--fm);color:var(--t2);opacity:0;transform:translateY(6px);transition:opacity 0.2s,transform 0.2s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:rgba(78,222,163,0.35);color:var(--g)}
.toast.err{border-color:rgba(239,68,68,0.4);color:var(--r)}
.toast.inf{border-color:rgba(77,142,255,0.35);color:var(--b)}
</style>
</head>
<body>
<div id="toast-box"></div>

<!-- Modal: Add Input -->
<div class="modal-bg" id="modal-add-input">
  <div class="modal-box">
    <div class="modal-hdr">
      <span class="modal-title">➕ Thêm Input</span>
      <button class="modal-close" id="btn-close-add-input">✕</button>
    </div>
    <div class="modal-body">
      <div class="input-type-tabs">
        <button class="it-tab active" data-itype="obs-source" id="itab-obs">
          <span class="it-tab-icon">📺</span>OBS Source
        </button>
        <button class="it-tab" data-itype="widget" id="itab-widget">
          <span class="it-tab-icon">🧩</span>Widget SDK
        </button>
      </div>
      <!-- OBS Source fields -->
      <div id="itype-obs-fields">
        <div class="fld">
          <label class="flbl">Nhãn hiển thị</label>
          <input class="finput" id="inp-obs-label" type="text" placeholder="VD: Cam Mục Sư">
        </div>
        <div class="fld">
          <label class="flbl">Loại OBS source</label>
          <select class="finput" id="inp-obs-kind">
            <option value="camera">📹 Camera (dshow_input)</option>
            <option value="window">🪟 Window Capture</option>
            <option value="game">🎮 Game Capture</option>
            <option value="media">📹 Media Source (Video)</option>
            <option value="browser">🌐 Browser Source</option>
            <option value="color">🎨 Color/Background</option>
            <option value="image">🖼 Image</option>
          </select>
        </div>
        <div class="fld">
          <label class="flbl">Tên source trong OBS (chính xác)</label>
          <input class="finput" id="inp-obs-source" type="text" placeholder="VD: Camera 1">
        </div>
        <div class="fld">
          <label class="flbl">Icon (emoji)</label>
          <input class="finput" id="inp-obs-icon" type="text" placeholder="📹" value="📹" style="width:80px">
        </div>
      </div>
      <!-- Widget SDK fields -->
      <div id="itype-widget-fields" style="display:none">
        <div class="fld">
          <label class="flbl">Nhãn hiển thị</label>
          <input class="finput" id="inp-widget-label" type="text" placeholder="VD: Lower Third">
        </div>
        <div class="fld">
          <label class="flbl">Chọn Widget</label>
          <select class="finput" id="inp-widget-id">
            <option value="">— Đang tải... —</option>
          </select>
        </div>
        <div class="fld">
          <label class="flbl">Icon (emoji)</label>
          <input class="finput" id="inp-widget-icon" type="text" placeholder="🧩" value="🧩" style="width:80px">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="mbtn cancel" id="btn-cancel-add-input">Hủy</button>
      <button class="mbtn primary" id="btn-confirm-add-input">✓ Thêm Input</button>
    </div>
  </div>
</div>

<!-- Modal: Add Scene Type -->
<div class="modal-bg" id="modal-add-st">
  <div class="modal-box" style="width:380px">
    <div class="modal-hdr">
      <span class="modal-title">➕ Scene Type Mới</span>
      <button class="modal-close" id="btn-close-add-st">✕</button>
    </div>
    <div class="modal-body">
      <div class="fld">
        <label class="flbl">Tên scene type</label>
        <input class="finput" id="inp-st-name" type="text" placeholder="VD: Giảng Luận">
      </div>
      <div class="fld">
        <label class="flbl">Icon (emoji)</label>
        <input class="finput" id="inp-st-icon" type="text" placeholder="📖" value="📖" style="width:80px">
      </div>
      <div class="fld">
        <label class="flbl">Màu nhận diện</label>
        <input class="finput" id="inp-st-color" type="color" value="#a855f7" style="height:32px;padding:2px;width:80px">
      </div>
      <div class="fld">
        <label class="flbl">Mô tả ngắn</label>
        <input class="finput" id="inp-st-desc" type="text" placeholder="Cảnh giảng luận...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="mbtn cancel" id="btn-cancel-add-st">Hủy</button>
      <button class="mbtn primary" id="btn-confirm-add-st">✓ Tạo</button>
    </div>
  </div>
</div>

<!-- Modal: Add Data Field -->
<div class="modal-bg" id="modal-add-df">
  <div class="modal-box" style="width:360px">
    <div class="modal-hdr">
      <span class="modal-title">➕ Thêm Data Field</span>
      <button class="modal-close" id="btn-close-add-df">✕</button>
    </div>
    <div class="modal-body">
      <div class="fld">
        <label class="flbl">Key (tên biến)</label>
        <input class="finput" id="inp-df-key" type="text" placeholder="speakerName">
      </div>
      <div class="fld">
        <label class="flbl">Nhãn hiển thị</label>
        <input class="finput" id="inp-df-label" type="text" placeholder="Tên diễn giả">
      </div>
      <div class="fld">
        <label class="flbl">Loại field</label>
        <select class="finput" id="inp-df-type">
          <option value="text">Text (1 dòng)</option>
          <option value="textarea">Textarea (nhiều dòng)</option>
          <option value="time">Thời gian</option>
          <option value="url">URL</option>
        </select>
      </div>
      <div class="fld">
        <label class="flbl">Placeholder</label>
        <input class="finput" id="inp-df-placeholder" type="text" placeholder="Nhập placeholder...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="mbtn cancel" id="btn-cancel-add-df">Hủy</button>

</div>

        <span class="ms">dashboard</span>Builder
      </a>

      </a>

        <!-- rendered by JS -->
      </div>

        <div style="font-size:9px;color:var(--t4);font-family:var(--fm)">hoặc bấm "Mới" để tạo mới</div>

        <span class="ms">layers</span>

        <div class="mini-canvas" id="mini-canvas">
          <div class="canvas-empty" id="canvas-empty">Chọn overlay →<br>thiết kế bố cục</div>
        </div>
      </div>
      <div class="rp-layers" id="rp-layers" style="display:none">
        <div class="rp-layers-title">Layers</div>

<script>
const API = 'http://localhost:3000';
const $ = id => document.getElementById(id);

// ── State ──────────────────────────────────────────────
const S = {
  sceneTypes: {},       // all scene types
  widgets: [],          // all widgets from server
  activeStId: null,     // active scene type id
  activeOverlayId: null,
  activeLayerId: null,  // selected input in canvas
  dirty: false,
  // mini-canvas drag
  dragging: null,
  resizing: null,
};

// ── Boot ──────────────────────────────────────────────
(async function init() {
  await Promise.all([loadSceneTypes(), loadWidgets()]);
  bindAll();
})();

async function loadSceneTypes() {
  try {
    const r = await fetch(`${API}/api/scene-types`);
    const data = await r.json();
    S.sceneTypes = data.sceneTypes || {};
    renderStList();
    // Auto-select first
    const firstId = Object.keys(S.sceneTypes)[0];
    if (firstId) selectSceneType(firstId);
  } catch { toast('Không kết nối được server!', 'err'); }
}

async function loadWidgets() {
  try {
    const r = await fetch(`${API}/api/widgets`);
    S.widgets = await r.json();
    populateWidgetSelect();
  } catch { S.widgets = []; }
}

function populateWidgetSelect() {
  const sel = $('inp-widget-id');
  sel.innerHTML = '<option value="">— Chọn widget —</option>' +
    S.widgets.map(w => `<option value="${w.id}">${w.icon||'🧩'} ${w.name} [${w.category||'?'}]</option>`).join('');
}

// ── Save ──────────────────────────────────────────────
async function saveAll() {
  try {
    const r = await fetch(`${API}/api/scene-types`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sceneTypes: S.sceneTypes }),
    });
    if (!r.ok) throw new Error();
    S.dirty = false;
    toast('Đã lưu Scene Types ✓', 'ok');
  } catch { toast('Lỗi lưu!', 'err'); }
}

// ── Scene Type List ───────────────────────────────────
function renderStList() {
  const list = $('st-list');
  const types = Object.values(S.sceneTypes);
  if (!types.length) {
    list.innerHTML = '<div style="padding:12px;text-align:center;font-size:9px;color:var(--t4);font-family:var(--fm)">Chưa có scene type nào</div>';
    return;
  }
  list.innerHTML = types.map(st => `
    <div class="st-item ${st.id === S.activeStId ? 'active' : ''}" data-stid="${st.id}">
      <span class="st-icon">${st.icon || '🎬'}</span>
      <div class="st-info">
        <div class="st-name">${st.label}</div>
        <div class="st-desc">${(st.inputs||[]).length} inputs · ${(st.overlays||[]).length} overlays</div>
      </div>
      <button class="st-del" data-del-stid="${st.id}" title="Xóa"><span class="ms">close</span></button>
    </div>`).join('');

  list.querySelectorAll('.st-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-del-stid]')) return;
      selectSceneType(el.dataset.stid);
    });
  });
  list.querySelectorAll('[data-del-stid]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm(`Xóa "${S.sceneTypes[btn.dataset.delStid]?.label}"?`)) return;
      delete S.sceneTypes[btn.dataset.delStid];
      if (S.activeStId === btn.dataset.delStid) { S.activeStId = null; renderEditor(); }
      S.dirty = true;
      renderStList();
    });
  });
}

function selectSceneType(id) {
  S.activeStId = id;
  S.activeOverlayId = null;
  S.activeLayerId = null;
  renderStList();
  renderEditor();
  renderCanvas();
}

// ── Editor ────────────────────────────────────────────
function renderEditor() {
  const editor = $('panel-editor');
  const st = S.sceneTypes[S.activeStId];
  if (!st) {
    editor.innerHTML = `<div class="editor-empty" id="editor-empty">
      <span class="big-icon">🎬</span>
      <div>Chọn Scene Type để chỉnh sửa</div>
      <div style="font-size:9px;color:var(--t4);font-family:var(--fm)">hoặc bấm "Mới" để tạo mới</div>
    </div>`;
    return;
  }

  editor.innerHTML = `
    <!-- Meta -->
    <div class="ed-section">
      <div class="ed-hdr">
        <div class="ed-hdr-icon p"><span style="font-size:14px">${st.icon||'🎬'}</span></div>
        <span class="ed-hdr-title">Thông Tin</span>
      </div>
      <div class="ed-body">
        <div class="meta-grid">
          <div class="fld">
            <label class="flbl">Tên</label>
            <input class="finput" id="ef-label" type="text" value="${st.label||''}">
          </div>
          <div class="fld">
            <label class="flbl">Icon</label>
            <input class="finput" id="ef-icon" type="text" value="${st.icon||'🎬'}" style="width:80px">
          </div>
          <div class="fld">
            <label class="flbl">Màu</label>
            <input class="finput" id="ef-color" type="color" value="${st.color||'#a855f7'}" style="height:28px;padding:2px;width:80px">
          </div>
          <div class="fld full">
            <label class="flbl">Mô tả</label>
            <input class="finput" id="ef-desc" type="text" value="${st.description||''}">
          </div>
        </div>
      </div>
    </div>

    <!-- Inputs -->
    <div class="ed-section">
      <div class="ed-hdr">
        <div class="ed-hdr-icon b"><span class="ms" style="font-size:11px;font-family:'Material Symbols Outlined'">input</span></div>
        <span class="ed-hdr-title">Inputs (nguồn nội dung)</span>
        <button class="ed-add-btn" id="btn-add-input"><span class="ms">add</span>Thêm Input</button>
      </div>
      <div class="ed-body">
        <div class="input-list" id="input-list">
          ${renderInputListHtml(st.inputs||[])}
        </div>
      </div>
    </div>

    <!-- Data Fields -->
    <div class="ed-section">
      <div class="ed-hdr">
        <div class="ed-hdr-icon g"><span class="ms" style="font-size:11px;font-family:'Material Symbols Outlined'">dataset</span></div>
        <span class="ed-hdr-title">Data Fields (nội dung nhập)</span>
        <button class="ed-add-btn" id="btn-add-df"><span class="ms">add</span>Thêm Field</button>
      </div>
      <div class="ed-body">
        <div class="df-list" id="df-list">
          ${renderDfListHtml(st.dataFields||[])}
        </div>
      </div>
    </div>

    <!-- Overlays -->
    <div class="ed-section">
      <div class="ed-hdr">
        <div class="ed-hdr-icon a"><span class="ms" style="font-size:11px;font-family:'Material Symbols Outlined'">layers</span></div>
        <span class="ed-hdr-title">Overlays (bố cục)</span>
        <button class="ed-add-btn" id="btn-add-overlay"><span class="ms">add</span>Thêm Overlay</button>
      </div>
      <div class="ed-body">
        <div class="overlay-list" id="overlay-list">
          ${renderOverlayListHtml(st.overlays||[], st.inputs||[])}
        </div>
      </div>
    </div>
  `;

  // Bind meta fields
  ['label','icon','color','desc'].forEach(k => {
    const el = $(`ef-${k}`);
    if (!el) return;
    el.addEventListener('input', () => {
      if (k === 'desc') st.description = el.value;
      else st[k] = el.value;
      S.dirty = true;
      if (k === 'label' || k === 'icon') renderStList();
    });
  });

  bindEditorEvents(st);
}

function renderInputListHtml(inputs) {
  if (!inputs.length) return '<div style="text-align:center;padding:10px;font-size:9px;color:var(--t4);font-family:var(--fm)">Chưa có input nào — bấm Thêm Input</div>';
  return inputs.map(inp => `
    <div class="input-item" data-inp-id="${inp.id}">
      <span class="input-icon">${inp.icon||'📌'}</span>
      <div class="input-info">
        <div class="input-label">${inp.label}</div>
        <div class="input-sub">${inp.type === 'obs-source' ? inp.obsSourceName || inp.inputKind : `widget: ${inp.widgetId}`}</div>
      </div>
      <span class="input-type-badge ${inp.type === 'widget' ? 'widget' : 'obs'}">${inp.type === 'widget' ? 'Widget' : 'OBS'}</span>
      <button class="input-del" data-del-inp="${inp.id}" title="Xóa"><span class="ms">close</span></button>
    </div>`).join('');
}

function renderDfListHtml(fields) {
  if (!fields.length) return '<div style="grid-column:1/-1;text-align:center;padding:10px;font-size:9px;color:var(--t4);font-family:var(--fm)">Chưa có field nào</div>';
  return fields.map(f => `
    <div class="df-item">
      <span class="ms" style="font-size:12px;font-family:\'Material Symbols Outlined\'">${{text:'text_fields',textarea:'notes',time:'schedule',url:'link'}[f.type]||'text_fields'}</span>
      <span class="df-key">${f.key}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.label}</span>
      <button class="df-del" data-del-df="${f.key}"><span class="ms">close</span></button>
    </div>`).join('');
}

function renderOverlayListHtml(overlays, inputs) {
  if (!overlays.length) return '<div style="text-align:center;padding:10px;font-size:9px;color:var(--t4);font-family:var(--fm)">Chưa có overlay nào — bấm Thêm Overlay</div>';
  return overlays.map(ov => {
    const visLayers = (ov.layers||[]).filter(l => l.visible !== false).length;
    return `
      <div class="overlay-item ${ov.id === S.activeOverlayId ? 'active' : ''}" data-ov-id="${ov.id}">
        <span class="ov-icon">${ov.icon||'🔲'}</span>
        <div class="ov-info">
          <div class="ov-label">${ov.label}</div>
          <div class="ov-desc">${ov.description||''}</div>
        </div>
        <span class="ov-layers-count">${visLayers}/${inputs.length} layers</span>
        <button class="ov-del" data-del-ov="${ov.id}" title="Xóa"><span class="ms">close</span></button>
      </div>`;
  }).join('');
}

function bindEditorEvents(st) {
  // Add input
  $('btn-add-input')?.addEventListener('click', () => openModal('modal-add-input'));

  // Delete input
  document.querySelectorAll('[data-del-inp]').forEach(btn => {
    btn.addEventListener('click', () => {
      st.inputs = (st.inputs||[]).filter(i => i.id !== btn.dataset.delInp);
      // Also remove from all overlays
      (st.overlays||[]).forEach(ov => {
        ov.layers = (ov.layers||[]).filter(l => l.inputId !== btn.dataset.delInp);
      });
      S.dirty = true;
      renderEditor();
      renderCanvas();
    });
  });

  // Add data field
  $('btn-add-df')?.addEventListener('click', () => openModal('modal-add-df'));

  // Delete data field
  document.querySelectorAll('[data-del-df]').forEach(btn => {
    btn.addEventListener('click', () => {
      st.dataFields = (st.dataFields||[]).filter(f => f.key !== btn.dataset.delDf);
      S.dirty = true;
      renderEditor();
    });
  });

  // Add overlay
  $('btn-add-overlay')?.addEventListener('click', () => openModal('modal-add-overlay'));

  // Select overlay for canvas
  document.querySelectorAll('.overlay-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-del-ov]')) return;
      selectOverlay(el.dataset.ovId);
    });
  });

  // Delete overlay
  document.querySelectorAll('[data-del-ov]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      st.overlays = (st.overlays||[]).filter(o => o.id !== btn.dataset.delOv);
      if (S.activeOverlayId === btn.dataset.delOv) { S.activeOverlayId = null; renderCanvas(); }
      S.dirty = true;
      renderEditor();
    });
  });
}

function selectOverlay(ovId) {
  S.activeOverlayId = ovId;
  S.activeLayerId = null;
  renderEditor();
  renderCanvas();
  $('rp-overlay-name').textContent = getActiveOverlay()?.label || 'Overlay';
}

function getActiveOverlay() {
  const st = S.sceneTypes[S.activeStId];
  return st?.overlays?.find(o => o.id === S.activeOverlayId) || null;
}

// ── Mini Canvas ───────────────────────────────────────
function renderCanvas() {
  const canvas = $('mini-canvas');
  const empty = $('canvas-empty');
  const rplayers = $('rp-layers');
  const ov = getActiveOverlay();
  const st = S.sceneTypes[S.activeStId];

  // Remove existing els
  canvas.querySelectorAll('.mc-el').forEach(e => e.remove());

  if (!ov || !st) {
    if (empty) empty.style.display = 'flex';
    if (rplayers) rplayers.style.display = 'none';
    return;
  }
  if (empty) empty.style.display = 'none';
  if (rplayers) rplayers.style.display = 'block';

  const W = canvas.offsetWidth, H = canvas.offsetHeight;

  (ov.layers||[]).forEach(layer => {
    if (!layer.visible) return;
    const inp = (st.inputs||[]).find(i => i.id === layer.inputId);
    if (!inp) return;

    const div = document.createElement('div');
    div.className = `mc-el ${layer.inputId === S.activeLayerId ? 'selected' : ''}`;
    div.dataset.inputId = layer.inputId;
    div.style.left   = (layer.x / 100 * W) + 'px';
    div.style.top    = (layer.y / 100 * H) + 'px';
    div.style.width  = (layer.w / 100 * W) + 'px';
    div.style.height = (layer.h / 100 * H) + 'px';
    div.style.borderRadius = (layer.r || 0) + 'px';
    div.style.opacity = (layer.opacity ?? 100) / 100;
    div.style.background = inp.type === 'widget'
      ? 'rgba(168,85,247,0.15)' : 'rgba(77,142,255,0.1)';

    div.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none">
      <span style="font-size:${Math.max(10, Math.min(20, layer.w/5))}px">${inp.icon||'📌'}</span>
      <span class="mc-el-label">${inp.label}</span>
    </div>`;

    // Resize handles
    ['tl','tr','bl','br'].forEach(pos => {
      const h = document.createElement('div');
      h.className = `rh-mc ${pos}`;
      h.dataset.handle = pos;
      div.appendChild(h);
    });

    div.addEventListener('mousedown', onMcMouseDown);
    div.addEventListener('click', e => {
      e.stopPropagation();
      S.activeLayerId = layer.inputId;
      renderCanvas();
      renderRpLayers();
    });

    canvas.appendChild(div);
  });

  renderRpLayers();
}

function renderRpLayers() {
  const ov = getActiveOverlay();
  const st = S.sceneTypes[S.activeStId];
  const list = $('rp-layer-list');
  if (!list || !ov || !st) return;

  list.innerHTML = (st.inputs||[]).map(inp => {
    const layer = (ov.layers||[]).find(l => l.inputId === inp.id);
    const vis = layer?.visible !== false;
    return `
      <div class="rp-layer-row ${inp.id === S.activeLayerId ? 'selected' : ''}" data-rp-inp="${inp.id}">
        <div class="rp-layer-dot"></div>
        <span class="rp-layer-name">${inp.icon||'📌'} ${inp.label}</span>
        <button class="rp-layer-vis" data-vis-inp="${inp.id}" title="${vis?'Ẩn':'Hiện'}">
          <span class="ms">${vis?'visibility':'visibility_off'}</span>
        </button>
      </div>`;
  }).join('');

  list.querySelectorAll('.rp-layer-row').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-vis-inp]')) return;
      S.activeLayerId = el.dataset.rpInp;
      renderCanvas();
      renderRpLayers();
    });
  });

  list.querySelectorAll('[data-vis-inp]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const ov = getActiveOverlay();
      let layer = (ov.layers||[]).find(l => l.inputId === btn.dataset.visInp);
      if (!layer) {
        const inp = (S.sceneTypes[S.activeStId].inputs||[]).find(i => i.id === btn.dataset.visInp);
        if (!inp) return;
        layer = { inputId: inp.id, x:5, y:5, w:40, h:40, r:0, opacity:100, visible:true };
        if (!ov.layers) ov.layers = [];
        ov.layers.push(layer);
      }
      layer.visible = !layer.visible;
      S.dirty = true;
      renderCanvas();
      renderRpLayers();
    });
  });
}

// ── Canvas Drag ───────────────────────────────────────
function onMcMouseDown(e) {
  if (e.target.classList.contains('rh-mc')) {
    onMcResizeStart(e); return;
  }
  const div = e.currentTarget;
  const canvas = $('mini-canvas');
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const ov = getActiveOverlay();
  const inputId = div.dataset.inputId;
  const layer = (ov?.layers||[]).find(l => l.inputId === inputId);
  if (!layer) return;
  e.preventDefault();
  S.dragging = { inputId, startX: e.clientX, startY: e.clientY, startLX: layer.x, startLY: layer.y, W, H };
}

function onMcResizeStart(e) {
  e.preventDefault();
  const handle = e.target;
  const div = handle.closest('.mc-el');
  const canvas = $('mini-canvas');
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const ov = getActiveOverlay();
  const inputId = div.dataset.inputId;
  const layer = (ov?.layers||[]).find(l => l.inputId === inputId);
  if (!layer) return;
  S.resizing = { inputId, handle: handle.dataset.handle, startX: e.clientX, startY: e.clientY, startLX: layer.x, startLY: layer.y, startLW: layer.w, startLH: layer.h, W, H };
}

document.addEventListener('mousemove', e => {
  if (S.dragging) {
    const { inputId, startX, startY, startLX, startLY, W, H } = S.dragging;
    const ov = getActiveOverlay();
    const layer = (ov?.layers||[]).find(l => l.inputId === inputId);
    if (!layer) return;
    const dx = (e.clientX - startX) / W * 100;
    const dy = (e.clientY - startY) / H * 100;
    layer.x = Math.max(0, Math.min(100 - layer.w, parseFloat((startLX + dx).toFixed(1))));
    layer.y = Math.max(0, Math.min(100 - layer.h, parseFloat((startLY + dy).toFixed(1))));
    S.dirty = true;
    renderCanvas();
  }
  if (S.resizing) {
    const { inputId, handle, startX, startY, startLX, startLY, startLW, startLH, W, H } = S.resizing;
    const ov = getActiveOverlay();
    const layer = (ov?.layers||[]).find(l => l.inputId === inputId);
    if (!layer) return;
    const dx = (e.clientX - startX) / W * 100;
    const dy = (e.clientY - startY) / H * 100;
    let nw = startLW, nh = startLH, nx = startLX, ny = startLY;
    if (handle.includes('r')) nw = Math.max(5, startLW + dx);
    if (handle.includes('l')) { nw = Math.max(5, startLW - dx); nx = startLX + (startLW - nw); }
    if (handle.includes('b')) nh = Math.max(5, startLH + dy);
    if (handle.includes('t')) { nh = Math.max(5, startLH - dy); ny = startLY + (startLH - nh); }
    layer.w = parseFloat(Math.min(100, nw).toFixed(1));
    layer.h = parseFloat(Math.min(100, nh).toFixed(1));
    layer.x = parseFloat(Math.max(0, nx).toFixed(1));
    layer.y = parseFloat(Math.max(0, ny).toFixed(1));
    S.dirty = true;
    renderCanvas();
  }
});

document.addEventListener('mouseup', () => {
  S.dragging = null;
  S.resizing = null;
});

// ── Modals ────────────────────────────────────────────
function openModal(id) {
  $(id).classList.add('open');
  // Pre-populate widget select when opening add-input
  if (id === 'modal-add-input') populateWidgetSelect();
}
function closeModal(id) { $(id).classList.remove('open'); }

// Input type tabs
document.querySelectorAll('.it-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.it-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    $('itype-obs-fields').style.display = btn.dataset.itype === 'obs-source' ? '' : 'none';
    $('itype-widget-fields').style.display = btn.dataset.itype === 'widget' ? '' : 'none';
  });
});

function genId(prefix) { return prefix + '-' + Math.random().toString(36).slice(2,7); }

// ── Bind All ─────────────────────────────────────────
function bindAll() {
  // New scene type
  $('btn-new-st').addEventListener('click', () => openModal('modal-add-st'));
  $('btn-close-add-st').addEventListener('click', () => closeModal('modal-add-st'));
  $('btn-cancel-add-st').addEventListener('click', () => closeModal('modal-add-st'));
  $('btn-confirm-add-st').addEventListener('click', () => {
    const name = $('inp-st-name').value.trim();
    if (!name) { toast('Nhập tên scene type!', 'err'); return; }
    const id = genId('st');
    S.sceneTypes[id] = {
      id, label: name,
      icon: $('inp-st-icon').value || '🎬',
      color: $('inp-st-color').value || '#a855f7',
      description: $('inp-st-desc').value,
      inputs: [], dataFields: [], overlays: [],
    };
    S.dirty = true;
    renderStList();
    selectSceneType(id);
    closeModal('modal-add-st');
    $('inp-st-name').value = '';
    toast(`Đã tạo "${name}" ✓`, 'ok');
  });

  // Close add-input modal
  $('btn-close-add-input').addEventListener('click', () => closeModal('modal-add-input'));
  $('btn-cancel-add-input').addEventListener('click', () => closeModal('modal-add-input'));
  $('btn-confirm-add-input').addEventListener('click', () => {
    const st = S.sceneTypes[S.activeStId];
    if (!st) return;
    const activeTab = document.querySelector('.it-tab.active')?.dataset.itype;
    let newInput;
    if (activeTab === 'obs-source') {
      const label = $('inp-obs-label').value.trim();
      if (!label) { toast('Nhập nhãn!', 'err'); return; }
      newInput = {
        id: genId('inp'),
        label,
        type: 'obs-source',
        inputKind: $('inp-obs-kind').value,
        obsSourceName: $('inp-obs-source').value.trim() || label,
        icon: $('inp-obs-icon').value || '📺',
      };
    } else {
      const label = $('inp-widget-label').value.trim();
      const widgetId = $('inp-widget-id').value;
      if (!label || !widgetId) { toast('Nhập đủ thông tin!', 'err'); return; }
      const wdef = S.widgets.find(w => w.id === widgetId);
      newInput = {
        id: genId('inp'),
        label,
        type: 'widget',
        widgetId,
        icon: $('inp-widget-icon').value || wdef?.icon || '🧩',
      };
    }
    if (!st.inputs) st.inputs = [];
    st.inputs.push(newInput);
    // Also add default layer in all overlays (hidden by default)
    (st.overlays||[]).forEach(ov => {
      if (!ov.layers) ov.layers = [];
      ov.layers.push({ inputId: newInput.id, x:5, y:5, w:30, h:30, r:0, opacity:100, visible:false });
    });
    S.dirty = true;
    renderEditor();
    renderCanvas();
    closeModal('modal-add-input');
    $('inp-obs-label').value = ''; $('inp-obs-source').value = '';
    $('inp-widget-label').value = '';
    toast(`Đã thêm input "${newInput.label}" ✓`, 'ok');
  });

  // Add data field
  $('btn-close-add-df').addEventListener('click', () => closeModal('modal-add-df'));
  $('btn-cancel-add-df').addEventListener('click', () => closeModal('modal-add-df'));
  $('btn-confirm-add-df').addEventListener('click', () => {
    const st = S.sceneTypes[S.activeStId];
    if (!st) return;
    const key = $('inp-df-key').value.trim().replace(/\s+/g,'');
    const label = $('inp-df-label').value.trim();
    if (!key || !label) { toast('Nhập key và nhãn!', 'err'); return; }
    if (!st.dataFields) st.dataFields = [];
    if (st.dataFields.find(f => f.key === key)) { toast('Key đã tồn tại!', 'err'); return; }
    st.dataFields.push({ key, label, type: $('inp-df-type').value, placeholder: $('inp-df-placeholder').value });
    S.dirty = true;
    renderEditor();
    closeModal('modal-add-df');
    $('inp-df-key').value = ''; $('inp-df-label').value = ''; $('inp-df-placeholder').value = '';
    toast(`Đã thêm field "${key}" ✓`, 'ok');
  });

  // Add overlay
  $('btn-close-add-overlay').addEventListener('click', () => closeModal('modal-add-overlay'));
  $('btn-cancel-add-overlay').addEventListener('click', () => closeModal('modal-add-overlay'));
  $('btn-confirm-add-overlay').addEventListener('click', () => {
    const st = S.sceneTypes[S.activeStId];
    if (!st) return;
    const label = $('inp-ov-label').value.trim();
    if (!label) { toast('Nhập tên overlay!', 'err'); return; }
    const id = genId('ov');
    // Create layers for all existing inputs (all hidden by default)
    const layers = (st.inputs||[]).map(inp => ({
      inputId: inp.id, x:5, y:5, w:40, h:40, r:0, opacity:100, visible:false
    }));
    if (!st.overlays) st.overlays = [];
    st.overlays.push({
      id, label,
      icon: $('inp-ov-icon').value || '🔲',
      description: $('inp-ov-desc').value,
      layers,
    });
    S.dirty = true;
    renderEditor();
    selectOverlay(id);
    closeModal('modal-add-overlay');
    $('inp-ov-label').value = ''; $('inp-ov-icon').value = ''; $('inp-ov-desc').value = '';
    toast(`Đã tạo overlay "${label}" ✓`, 'ok');
  });

  // Save
  $('btn-save-all').addEventListener('click', saveAll);

  // Close modals on bg click
  ['modal-add-input','modal-add-st','modal-add-df','modal-add-overlay'].forEach(id => {
    $(id).addEventListener('click', e => { if (e.target === $(id)) closeModal(id); });
  });

  // Canvas click deselect
  $('mini-canvas').addEventListener('click', e => {
    if (e.target === $('mini-canvas') || e.target.classList.contains('canvas-empty')) {
      S.activeLayerId = null;
      renderCanvas();
    }
  });
}

// ── Toast ─────────────────────────────────────────────
function toast(msg, type='inf') {
  const box = $('toast-box');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  box.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 2500);
}
</script>
