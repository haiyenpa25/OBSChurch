<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene Designer — OBSChurch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --f:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',monospace;
  --b0:#04040c;--b1:#08081a;--b2:#0e0e22;--b3:#141430;--b4:#1a1a3a;
  --bd:rgba(255,255,255,0.08);--bdd:rgba(255,255,255,0.04);
  --p:#a855f7;--pd:rgba(168,85,247,0.15);--pp:rgba(168,85,247,0.3);
  --g:#4edea3;--gd:rgba(78,222,163,0.15);--gp:rgba(78,222,163,0.3);
  --b:#4d8eff;--bd2:rgba(77,142,255,0.15);--bp:rgba(77,142,255,0.3);
  --a:#fbbf24;--ad:rgba(251,191,36,0.15);
  --r:#ef4444;--rd:rgba(239,68,68,0.15);
  --c:#00f5ff;--cd:rgba(0,245,255,0.1);
  --t1:#f0f0ff;--t2:#9090b0;--t3:#505070;--t4:#2a2a48;
}
html,body{height:100%;background:var(--b0);font-family:var(--f);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--f);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--f);color:var(--t1);background:var(--b1);border:1px solid var(--bd);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.ms{font-family:'Material Symbols Outlined';font-style:normal;font-size:inherit;line-height:1}

/* ── SHELL ── */
#app{display:grid;grid-template-rows:44px 1fr;height:100vh}

/* ── TOPBAR ── */
#topbar{
  background:rgba(4,4,12,0.98);border-bottom:1px solid var(--bd);
  backdrop-filter:blur(20px);display:flex;align-items:center;
  padding:0 10px;gap:8px;z-index:100;flex-shrink:0
}
.brand{display:flex;align-items:center;gap:6px;flex-shrink:0}
.brand-logo{width:24px;height:24px;background:linear-gradient(135deg,var(--p),#6d28d9);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.brand-name{font-size:11px;font-weight:800;letter-spacing:0.04em}
.brand-name em{color:var(--p);font-style:normal}
.tb-sep{width:1px;height:16px;background:var(--bd);flex-shrink:0}
.tb-btn{
  display:flex;align-items:center;gap:4px;height:24px;padding:0 9px;
  border-radius:5px;border:1px solid var(--bd);background:transparent;
  color:var(--t2);font-size:9px;transition:all 0.15s;text-decoration:none;
  cursor:pointer;white-space:nowrap;flex-shrink:0
}
.tb-btn:hover{background:rgba(255,255,255,0.07);color:var(--t1)}
.tb-btn .ms{font-size:12px}
.tb-btn.primary{background:linear-gradient(135deg,var(--p),#6d28d9);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 0 8px rgba(168,85,247,0.3)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}

/* ── WORKSPACE ── */
#workspace{display:grid;grid-template-columns:200px 1fr 260px;overflow:hidden}

/* ═══ LEFT: Scene Types + Overlays ═══ */
#panel-left{background:var(--b1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.lp-sect{flex-shrink:0}
.lp-hdr{padding:7px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:5px}
.lp-hdr-title{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;flex:1}
.lp-add{height:20px;padding:0 7px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--t3);font-size:9px;display:flex;align-items:center;gap:2px;transition:all 0.12s}
.lp-add:hover{background:var(--pd);color:var(--p);border-color:var(--pp)}
.lp-add .ms{font-size:10px}

/* Scene type items */
.st-list{overflow-y:auto;max-height:140px}
.st-list::-webkit-scrollbar{width:2px}
.st-list::-webkit-scrollbar-thumb{background:var(--bd)}
.st-item{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;border-left:2px solid transparent;transition:all 0.1s}
.st-item:hover{background:rgba(255,255,255,0.03)}
.st-item.active{background:var(--pd);border-left-color:var(--p)}
.st-item-icon{font-size:13px;flex-shrink:0}
.st-item-info{flex:1;min-width:0}
.st-item-name{font-size:10px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-item-count{font-size:7px;color:var(--t3);font-family:var(--fm)}
.st-del{width:16px;height:16px;border-radius:3px;border:none;background:transparent;color:var(--t4);display:flex;align-items:center;justify-content:center;opacity:0;transition:all 0.1s;flex-shrink:0}
.st-item:hover .st-del{opacity:1}
.st-del:hover{background:var(--rd);color:var(--r)}
.st-del .ms{font-size:11px}

/* Overlay tabs */
.ov-tabs-wrap{border-bottom:1px solid var(--bd);overflow-y:auto;flex:1;min-height:0}
.ov-tabs-wrap::-webkit-scrollbar{width:2px}
.ov-tabs-wrap::-webkit-scrollbar-thumb{background:var(--bd)}
.ov-tab{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;border-left:2px solid transparent;transition:all 0.1s;border-bottom:1px solid var(--bdd)}
.ov-tab:hover{background:rgba(255,255,255,0.03)}
.ov-tab.active{background:var(--ad);border-left-color:var(--a)}
.ov-tab-icon{font-size:14px;flex-shrink:0}
.ov-tab-name{font-size:10px;font-weight:600;color:var(--t1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-tab-del{width:15px;height:15px;border-radius:3px;border:none;background:transparent;color:var(--t4);display:flex;align-items:center;justify-content:center;opacity:0;transition:all 0.1s;flex-shrink:0}
.ov-tab:hover .ov-tab-del{opacity:1}
.ov-tab-del:hover{background:var(--rd);color:var(--r)}
.ov-tab-del .ms{font-size:10px}

/* Layer list */
.layers-sect{flex-shrink:0;border-top:1px solid var(--bd)}
.layer-list{overflow-y:auto;max-height:180px}
.layer-list::-webkit-scrollbar{width:2px}
.layer-list::-webkit-scrollbar-thumb{background:var(--bd)}
.layer-item{display:flex;align-items:center;gap:5px;padding:4px 8px;cursor:pointer;border-left:2px solid transparent;transition:all 0.1s;border-bottom:1px solid var(--bdd)}
.layer-item:hover{background:rgba(255,255,255,0.03)}
.layer-item.selected{background:var(--pd);border-left-color:var(--p)}
.layer-thumb{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.layer-thumb.cam{background:var(--cd);color:var(--c)}
.layer-thumb.text{background:var(--pd);color:var(--p)}
.layer-thumb.image{background:var(--gd);color:var(--g)}
.layer-thumb.shape{background:rgba(251,191,36,0.15);color:var(--a)}
.layer-thumb.widget{background:rgba(77,142,255,0.15);color:var(--b)}
.layer-name{font-size:9px;color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-ctrls{display:flex;gap:2px;flex-shrink:0}
.lc-btn{width:15px;height:15px;border-radius:3px;border:none;background:transparent;color:var(--t4);display:flex;align-items:center;justify-content:center;transition:all 0.1s}
.lc-btn:hover{background:rgba(255,255,255,0.08);color:var(--t1)}
.lc-btn.active{color:var(--t2)}
.lc-btn .ms{font-size:10px}

/* ═══ CENTER: Canvas ═══ */
#panel-center{
  background:#020208;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:10px 16px 16px;position:relative;overflow:hidden;gap:8px;
}
#panel-center::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(168,85,247,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(168,85,247,0.02) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;
}

/* Add elements toolbar */
#add-toolbar{display:flex;gap:5px;align-items:center;z-index:10;flex-shrink:0;flex-wrap:wrap}
.add-btn{
  height:26px;padding:0 10px;border-radius:5px;border:1px solid var(--bd);
  background:var(--b2);color:var(--t2);font-size:9px;font-family:var(--fm);
  display:flex;align-items:center;gap:4px;cursor:pointer;transition:all 0.12s;
}
.add-btn:hover{border-color:rgba(255,255,255,0.2);color:var(--t1);background:var(--b3)}
.add-btn .ms{font-size:13px}
.add-btn.cam-btn:hover{border-color:var(--c);color:var(--c);background:var(--cd)}
.add-btn.text-btn:hover{border-color:var(--p);color:var(--p);background:var(--pd)}
.add-btn.img-btn:hover{border-color:var(--g);color:var(--g);background:var(--gd)}
.add-btn.shape-btn:hover{border-color:var(--a);color:var(--a);background:var(--ad)}
.add-btn.widget-btn:hover{border-color:var(--b);color:var(--b);background:var(--bd2)}
.tb-sep2{width:1px;height:18px;background:var(--bd)}

/* Canvas wrap */
#canvas-wrap{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;z-index:5;flex-shrink:0}
.canvas-label{position:absolute;top:-18px;left:0;font-size:7px;font-family:var(--fm);color:var(--t3);letter-spacing:0.08em}
.canvas-label span{color:var(--t2)}
#canvas{
  width:100%;height:100%;background:#0a0a16;
  border:1px solid var(--bd);border-radius:6px;position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 16px 50px rgba(0,0,0,0.9);
}
.c-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 35% 65%,rgba(30,10,60,0.4) 0%,rgba(4,4,12,1) 65%)}
.c-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px);
  background-size:5% 8.333%;
}
.c-safe{position:absolute;inset:5%;border:1px solid rgba(255,255,255,0.04);pointer-events:none}
.c-empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--t4);pointer-events:none}
.c-empty-hint .big{font-size:32px}
.c-empty-hint .txt{font-size:10px;font-family:var(--fm)}

/* Canvas elements */
.c-el{position:absolute;cursor:move;user-select:none;outline:none;transition:box-shadow 0.1s}
.c-el:hover{z-index:10}
.c-el.selected{z-index:20}

/* Camera */
.c-cam{
  border:2px solid var(--c);background:var(--cd);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(0,245,255,0.3),inset 0 0 8px rgba(0,245,255,0.04);
}
.c-cam.selected{box-shadow:0 0 28px rgba(0,245,255,0.5),0 0 0 2px var(--c)}
.c-cam-lbl{font-size:7px;font-family:var(--fm);color:rgba(0,245,255,0.7);letter-spacing:0.1em;pointer-events:none;text-align:center}

/* Text */
.c-text-inner{
  border-left:3px solid var(--el-color,var(--p));
  background:linear-gradient(to right,rgba(10,10,20,0.95),rgba(10,10,20,0.65));
  border-radius:0 5px 5px 0;padding:5px 8px;height:100%;
}
.c-text.selected .c-text-inner{box-shadow:0 0 0 2px var(--el-color,var(--p))}
.ct-primary{font-size:11px;font-weight:700;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-secondary{font-size:7px;color:var(--el-color,var(--p));font-family:var(--fm);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Image */
.c-image{border:1px dashed rgba(78,222,163,0.4);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--gd)}
.c-image img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.c-image.selected{box-shadow:0 0 0 2px var(--g)}
.c-image-placeholder{font-size:8px;color:rgba(78,222,163,0.5);font-family:var(--fm);text-align:center;padding:4px}

/* Shape */
.c-shape{display:flex;align-items:center;justify-content:center}
.c-shape.selected{outline:2px solid var(--a)}

/* Widget */
.c-widget{border:1px solid rgba(77,142,255,0.3);border-radius:5px;background:var(--bd2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
.c-widget.selected{box-shadow:0 0 0 2px var(--b)}
.c-widget-icon{font-size:18px}
.c-widget-name{font-size:7px;color:rgba(77,142,255,0.7);font-family:var(--fm);text-align:center}

/* Element label */
.c-el-label{position:absolute;bottom:2px;right:4px;font-size:6px;font-family:var(--fm);opacity:0.5;pointer-events:none;color:var(--t2)}

/* Resize handles */
.rh{
  position:absolute;width:7px;height:7px;background:var(--p);
  border:1px solid #000;border-radius:1px;z-index:30;
  display:none;
}
.c-el.selected .rh{display:block}
.rh.tl{top:-4px;left:-4px;cursor:nw-resize}
.rh.tr{top:-4px;right:-4px;cursor:ne-resize}
.rh.bl{bottom:-4px;left:-4px;cursor:sw-resize}
.rh.br{bottom:-4px;right:-4px;cursor:se-resize}

/* ═══ RIGHT: Props Panel ═══ */
#panel-right{
  background:var(--b1);border-left:1px solid var(--bd);
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
}
#panel-right::-webkit-scrollbar{width:3px}
#panel-right::-webkit-scrollbar-thumb{background:var(--bd)}
.rp-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--t4);font-size:10px;font-family:var(--fm);flex-direction:column;gap:6px;padding:20px;text-align:center}
.rp-empty .bi{font-size:28px}

.prop-hdr{padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--b2);flex-shrink:0;display:flex;align-items:center;gap:6px}
.prop-hdr-icon{font-size:16px}
.prop-hdr-title{font-size:10px;font-weight:700;color:var(--t1);flex:1}
.prop-hdr-type{font-size:7px;color:var(--t3);font-family:var(--fm);padding:2px 6px;border-radius:8px;background:var(--b3)}
.prop-body{padding:10px 12px;display:flex;flex-direction:column;gap:10px}

/* Property groups */
.pg{display:flex;flex-direction:column;gap:6px}
.pg-title{font-size:8px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid var(--bd);padding-bottom:4px}
.pf{display:flex;flex-direction:column;gap:3px}
.pf.row{flex-direction:row;align-items:center;gap:6px}
.pl{font-size:8px;color:var(--t3);font-family:var(--fm)}
.pi{height:26px;padding:0 8px;border-radius:5px;font-size:10px;width:100%}
textarea.pi{height:50px;padding:6px 8px;resize:vertical}
.pi.color-pi{width:40px;height:26px;padding:2px;cursor:pointer}
.pi.small{width:60px}

/* Position grid */
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pos-item{display:flex;align-items:center;gap:4px}
.pos-item .pl{width:14px;flex-shrink:0}
.pos-item .pi{width:100%}

/* Range slider */
.pf-range{display:flex;align-items:center;gap:6px}
.pi-range{-webkit-appearance:none;height:3px;border-radius:2px;background:var(--bd);border:none;flex:1;cursor:pointer}
.pi-range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--p);cursor:pointer}
.range-val{font-size:8px;color:var(--t3);font-family:var(--fm);width:28px;text-align:right;flex-shrink:0}

/* Image file pick */
.img-pick-area{border:1px dashed var(--bd);border-radius:6px;padding:8px;text-align:center;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.img-pick-area:hover{border-color:var(--g);background:var(--gd)}
.img-pick-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-pick-icon{font-size:18px;display:block;margin-bottom:3px}
.img-pick-text{font-size:8px;color:var(--t3);font-family:var(--fm)}
.img-preview{width:100%;border-radius:4px;max-height:60px;object-fit:cover;margin-top:4px}

/* Widget list in props */
.widget-pick-list{display:flex;flex-direction:column;gap:3px;max-height:120px;overflow-y:auto}
.widget-pick-list::-webkit-scrollbar{width:2px}
.widget-pick-list::-webkit-scrollbar-thumb{background:var(--bd)}
.wpl-item{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;border:1px solid var(--bd);background:transparent;cursor:pointer;transition:all 0.1s}
.wpl-item:hover,.wpl-item.selected{background:var(--bd2);border-color:var(--bp)}
.wpl-item-icon{font-size:14px;flex-shrink:0}
.wpl-item-name{font-size:9px;color:var(--t2);flex:1}
.wpl-item-cat{font-size:7px;color:var(--t3);font-family:var(--fm)}

/* Action buttons in props */
.pa-row{display:flex;gap:5px;flex-wrap:wrap}
.pa-btn{height:24px;padding:0 10px;border-radius:5px;border:1px solid var(--bd);background:var(--b2);color:var(--t2);font-size:9px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all 0.12s}
.pa-btn:hover{background:var(--b3);color:var(--t1)}
.pa-btn.danger{border-color:var(--rd);color:var(--r)}
.pa-btn.danger:hover{background:var(--rd)}
.pa-btn .ms{font-size:11px}

/* ── Toast ── */
#toast-box{position:fixed;bottom:12px;right:12px;z-index:9999;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.toast{background:var(--b3);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:9px;font-family:var(--fm);color:var(--t2);opacity:0;transform:translateY(6px);transition:opacity 0.2s,transform 0.2s}
.toast.show{opacity:1;transform:none}
.toast.ok{border-color:rgba(78,222,163,0.35);color:var(--g)}
.toast.err{border-color:rgba(239,68,68,0.4);color:var(--r)}
.toast.inf{border-color:rgba(77,142,255,0.35);color:var(--b)}

/* ── Modals ── */
.m-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:8000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.m-bg.open{opacity:1;pointer-events:all}
.m-box{background:var(--b2);border:1px solid var(--bd);border-radius:10px;width:360px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.9)}
.m-hdr{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.m-title{font-size:12px;font-weight:700}
.m-close{color:var(--t3);font-size:16px;cursor:pointer}
.m-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m-footer{padding:10px 16px;border-top:1px solid var(--bd);display:flex;gap:6px;justify-content:flex-end}
.m-btn{height:28px;padding:0 12px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;border:none}
.m-btn.p{background:linear-gradient(135deg,var(--p),#6d28d9);color:#fff}
.m-btn.c{background:transparent;border:1px solid var(--bd);color:var(--t2)}
</style>
</head>
<body>
<div id="toast-box"></div>

<!-- Modal: New Scene Type -->
<div class="m-bg" id="m-st">
  <div class="m-box">
    <div class="m-hdr">
      <span class="m-title">🎬 Scene Type Mới</span>
      <button class="m-close" onclick="closeM('m-st')">✕</button>
    </div>
    <div class="m-body">
      <div class="pf"><label class="pl">Tên</label><input class="pi" id="m-st-name" placeholder="Giảng Luận"></div>
      <div class="pf row">
        <label class="pl" style="width:60px">Icon</label>
        <input class="pi small" id="m-st-icon" placeholder="📖" value="🎬">
        <label class="pl" style="width:40px">Màu</label>
        <input class="pi color-pi" id="m-st-color" type="color" value="#a855f7">
      </div>
    </div>
    <div class="m-footer">
      <button class="m-btn c" onclick="closeM('m-st')">Hủy</button>
      <button class="m-btn p" id="m-st-ok">✓ Tạo</button>
    </div>
  </div>
</div>

<!-- Modal: New Overlay -->
<div class="m-bg" id="m-ov">
  <div class="m-box">
    <div class="m-hdr">
      <span class="m-title">➕ Overlay Mới</span>
      <button class="m-close" onclick="closeM('m-ov')">✕</button>
    </div>
    <div class="m-body">
      <div class="pf"><label class="pl">Tên overlay</label><input class="pi" id="m-ov-name" placeholder="Bình Thường"></div>
      <div class="pf row">
        <label class="pl" style="width:60px">Icon</label>

      <button class="m-btn c" onclick="closeM('m-ov')">Hủy</button>
      <button class="m-btn p" id="m-ov-ok">✓ Tạo</button>

</div>

<!-- MAIN -->
<div id="app">

    <div class="brand">

<script>
const API = 'http://localhost:3001';
const $ = id => document.getElementById(id);

// ─── State ─────────────────────────────────────────
const S = {
  sceneTypes: {},
  widgets: [],
  activeStId: null,
  activeOvId: null,
  elements: [],     // current overlay elements
  selectedId: null,
  dragging: null,
  resizing: null,
  history: [],
  histIdx: -1,
  dirty: false,
};
let idCounter = 0;
const genId = () => 'el-' + (++idCounter);

// ─── Boot ──────────────────────────────────────────
(async function init() {
  await Promise.all([loadSceneTypes(), loadWidgets()]);
  bindAll();
  renderStList();
  new ResizeObserver(renderCanvas).observe($('canvas'));
})();

// ─── Data Loading ──────────────────────────────────
async function loadSceneTypes() {
  try {
    const r = await fetch(`${API}/api/scene-types`);
    const d = await r.json();
    S.sceneTypes = d.sceneTypes || {};
    // Auto-select first
    const ids = Object.keys(S.sceneTypes);
    if (ids.length) selectSt(ids[0]);
  } catch { toast('Server offline', 'err'); }
}

async function loadWidgets() {
  try {
    const r = await fetch(`${API}/api/widgets`);
    S.widgets = await r.json();
  } catch { S.widgets = []; }
}

async function saveAll() {
  // Persist current overlay elements before saving
  persistCurrentOverlay();
  try {
    await fetch(`${API}/api/scene-types`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sceneTypes: S.sceneTypes }),
    });
    S.dirty = false;
    toast('Đã lưu ✓', 'ok');
  } catch { toast('Lỗi lưu!', 'err'); }
}

function persistCurrentOverlay() {
  const ov = getActiveOverlay();
  if (ov) ov.elements = JSON.parse(JSON.stringify(S.elements));
}

// ─── Scene Type List ───────────────────────────────
function renderStList() {
  const list = $('st-list');
  const types = Object.values(S.sceneTypes);
  if (!types.length) {
    list.innerHTML = '<div style="padding:10px;text-align:center;font-size:8px;color:var(--t4);font-family:var(--fm)">Chưa có — bấm Mới</div>';
    return;
  }
  list.innerHTML = types.map(st => `
    <div class="st-item ${st.id === S.activeStId ? 'active' : ''}" data-stid="${st.id}">
      <span class="st-item-icon">${st.icon || '🎬'}</span>
      <div class="st-item-info">
        <div class="st-item-name">${st.label}</div>
        <div class="st-item-count">${(st.overlays||[]).length} overlays</div>
      </div>
      <button class="st-del" data-del-st="${st.id}" title="Xóa"><span class="ms">close</span></button>
    </div>`).join('');

  list.querySelectorAll('.st-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-del-st]')) return;
      selectSt(el.dataset.stid);
    });
  });
  list.querySelectorAll('[data-del-st]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm(`Xóa "${S.sceneTypes[btn.dataset.delSt]?.label}"?`)) return;
      delete S.sceneTypes[btn.dataset.delSt];
      if (S.activeStId === btn.dataset.delSt) { S.activeStId = null; S.activeOvId = null; clearCanvas(); }
      S.dirty = true;
      renderStList();
    });
  });
}

function selectSt(id) {
  persistCurrentOverlay();
  S.activeStId = id;
  S.activeOvId = null;
  renderStList();
  renderOvTabs();
  // Auto-select first overlay
  const st = S.sceneTypes[id];
  const firstOv = st?.overlays?.[0];
  if (firstOv) selectOv(firstOv.id);
  updateCrumb();
}

// ─── Overlay Tabs ──────────────────────────────────
function renderOvTabs() {
  const st = S.sceneTypes[S.activeStId];
  const wrap = $('ov-tabs');
  if (!st) { wrap.innerHTML = ''; return; }
  const ovs = st.overlays || [];
  if (!ovs.length) {
    wrap.innerHTML = '<div style="padding:8px;text-align:center;font-size:8px;color:var(--t4);font-family:var(--fm)">Chưa có overlay</div>';
    return;
  }
  wrap.innerHTML = ovs.map(ov => `
    <div class="ov-tab ${ov.id === S.activeOvId ? 'active' : ''}" data-ovid="${ov.id}">
      <span class="ov-tab-icon">${ov.icon || '🔲'}</span>
      <span class="ov-tab-name">${ov.label}</span>
      <button class="ov-tab-del" data-del-ov="${ov.id}" title="Xóa"><span class="ms">close</span></button>
    </div>`).join('');

  wrap.querySelectorAll('.ov-tab').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-del-ov]')) return;
      selectOv(el.dataset.ovid);
    });
  });
  wrap.querySelectorAll('[data-del-ov]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const st = S.sceneTypes[S.activeStId];
      if (!st) return;
      st.overlays = (st.overlays||[]).filter(o => o.id !== btn.dataset.delOv);
      if (S.activeOvId === btn.dataset.delOv) { S.activeOvId = null; S.elements = []; clearCanvas(); }
      S.dirty = true;
      renderOvTabs();
    });
  });
}

function selectOv(id) {
  persistCurrentOverlay();
  S.activeOvId = id;
  const ov = getActiveOverlay();
  S.elements = ov ? JSON.parse(JSON.stringify(ov.elements || [])) : [];
  S.selectedId = null;
  S.history = []; S.histIdx = -1;
  pushHistory();
  renderOvTabs();
  renderCanvas();
  renderLayerList();
  renderProps();
  updateCrumb();
  $('lbl-overlay').textContent = ov?.label || '—';
}

function getActiveOverlay() {
  const st = S.sceneTypes[S.activeStId];
  return st?.overlays?.find(o => o.id === S.activeOvId) || null;
}

function updateCrumb() {
  const st = S.sceneTypes[S.activeStId];
  const ov = getActiveOverlay();
  $('tb-crumb').textContent = st ? `${st.icon||''} ${st.label}${ov ? ' → ' + ov.label : ''}` : 'Chọn scene type';
}

// ─── Canvas ────────────────────────────────────────
function clearCanvas() {
  S.elements = [];
  S.selectedId = null;
  renderCanvas();
  renderLayerList();
  renderProps();
  $('lbl-overlay').textContent = '—';
  updateCrumb();
}

function renderCanvas() {
  const canvas = $('canvas');
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W || !H) return;

  canvas.querySelectorAll('.c-el').forEach(e => e.remove());
  const hint = $('c-hint');
  if (hint) hint.style.display = S.elements.length ? 'none' : 'flex';

  S.elements.forEach(el => {
    if (!el.visible) return;
    canvas.appendChild(createElDom(el, W, H));
  });
}

function createElDom(el, W, H) {
  const div = document.createElement('div');
  div.className = 'c-el';
  div.dataset.id = el.id;
  if (el.id === S.selectedId) div.classList.add('selected');

  div.style.left    = (el.x / 100 * W) + 'px';
  div.style.top     = (el.y / 100 * H) + 'px';
  div.style.width   = (el.w / 100 * W) + 'px';
  div.style.height  = (el.h / 100 * H) + 'px';
  div.style.opacity = (el.opacity ?? 100) / 100;
  if (el.r) div.style.borderRadius = el.r + 'px';

  if (el.type === 'cam') {
    div.classList.add('c-cam');
    const lbl = document.createElement('div');
    lbl.className = 'c-cam-lbl';
    lbl.innerHTML = `📹<br>${el.label || 'Camera'}`;
    div.appendChild(lbl);

  } else if (el.type === 'text') {
    div.classList.add('c-text');
    div.style.setProperty('--el-color', el.color || '#a855f7');
    const inner = document.createElement('div');
    inner.className = 'c-text-inner';
    inner.style.borderLeftColor = el.color || '#a855f7';
    if (el.bgBlur) inner.style.backdropFilter = `blur(${el.bgBlur}px)`;
    inner.innerHTML = `
      <span class="ct-primary" style="color:${el.textColor||'#fff'};font-size:${Math.max(8,el.fontSize||14)}px;font-weight:${el.bold?700:400}">${el.primary || 'Tiêu Đề'}</span>
      <span class="ct-secondary" style="color:${el.color||'#a855f7'}">${el.secondary || 'Phụ đề'}</span>`;
    div.appendChild(inner);

  } else if (el.type === 'image') {
    div.classList.add('c-image');
    if (el.src) {
      const img = document.createElement('img');
      img.src = el.src;
      div.appendChild(img);
    } else {
      div.innerHTML = `<div class="c-image-placeholder"><span style="font-size:18px">🖼</span><br>Chọn hình</div>`;
    }

  } else if (el.type === 'shape') {
    div.classList.add('c-shape');
    div.style.background = el.fill || 'rgba(168,85,247,0.2)';
    div.style.border = el.border ? `${el.borderW||1}px solid ${el.borderColor||'#a855f7'}` : 'none';

  } else if (el.type === 'widget') {
    div.classList.add('c-widget');
    div.innerHTML = `<span class="c-widget-icon">${el.icon || '🧩'}</span><span class="c-widget-name">${el.label || 'Widget'}</span>`;
  }

  // Element label
  const lbl = document.createElement('div');
  lbl.className = 'c-el-label';
  lbl.textContent = el.label || el.type;
  div.appendChild(lbl);

  // Resize handles
  ['tl','tr','bl','br'].forEach(pos => {
    const h = document.createElement('span');
    h.className = `rh ${pos}`;
    h.dataset.handle = pos;
    div.appendChild(h);
  });

  div.addEventListener('mousedown', onElMouseDown);
  div.addEventListener('click', e => { e.stopPropagation(); selectEl(el.id); });
  return div;
}

// ─── Drag & Resize ─────────────────────────────────
function onElMouseDown(e) {
  if (e.target.classList.contains('rh')) { startResize(e); return; }
  e.preventDefault();
  const el = S.elements.find(x => x.id === e.currentTarget.dataset.id);
  if (!el) return;
  const canvas = $('canvas');
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  S.dragging = { id: el.id, startX: e.clientX, startY: e.clientY, origX: el.x, origY: el.y, W, H };
  selectEl(el.id);
}

function startResize(e) {
  e.preventDefault(); e.stopPropagation();
  const handle = e.target.dataset.handle;
  const elDom  = e.target.closest('.c-el');
  const el     = S.elements.find(x => x.id === elDom.dataset.id);
  if (!el) return;
  const canvas = $('canvas');
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  S.resizing = { id: el.id, handle, startX: e.clientX, startY: e.clientY, origX: el.x, origY: el.y, origW: el.w, origH: el.h, W, H };
}

document.addEventListener('mousemove', e => {
  if (S.dragging) {
    const { id, startX, startY, origX, origY, W, H } = S.dragging;
    const el = S.elements.find(x => x.id === id);
    if (!el) return;
    const dx = (e.clientX - startX) / W * 100;
    const dy = (e.clientY - startY) / H * 100;
    el.x = parseFloat(Math.max(0, Math.min(100 - el.w, origX + dx)).toFixed(1));
    el.y = parseFloat(Math.max(0, Math.min(100 - el.h, origY + dy)).toFixed(1));
    S.dirty = true;
    renderCanvas();
    updatePosInProps(el);
  }
  if (S.resizing) {
    const { id, handle, startX, startY, origX, origY, origW, origH, W, H } = S.resizing;
    const el = S.elements.find(x => x.id === id);
    if (!el) return;
    const dx = (e.clientX - startX) / W * 100;
    const dy = (e.clientY - startY) / H * 100;
    let nx = origX, ny = origY, nw = origW, nh = origH;
    if (handle.includes('r')) nw = Math.max(3, origW + dx);
    if (handle.includes('l')) { nw = Math.max(3, origW - dx); nx = origX + (origW - nw); }
    if (handle.includes('b')) nh = Math.max(3, origH + dy);
    if (handle.includes('t')) { nh = Math.max(3, origH - dy); ny = origY + (origH - nh); }
    el.x = parseFloat(Math.max(0,nx).toFixed(1));
    el.y = parseFloat(Math.max(0,ny).toFixed(1));
    el.w = parseFloat(Math.min(100,nw).toFixed(1));
    el.h = parseFloat(Math.min(100,nh).toFixed(1));
    S.dirty = true;
    renderCanvas();
    updatePosInProps(el);
  }
});

document.addEventListener('mouseup', () => {
  if (S.dragging || S.resizing) { S.dragging = null; S.resizing = null; pushHistory(); }
});

$('canvas').addEventListener('click', e => {
  if (e.target === $('canvas') || e.target.classList.contains('c-bg') || e.target.classList.contains('c-grid') || e.target.classList.contains('c-safe')) {
    S.selectedId = null;
    renderCanvas();
    renderLayerList();
    renderProps();
  }
});

// ─── Select Element ────────────────────────────────
function selectEl(id) {
  S.selectedId = id;
  renderCanvas();
  renderLayerList();
  renderProps();
}

// ─── Add Elements ──────────────────────────────────
function addElement(type) {
  if (!S.activeOvId) { toast('Chọn overlay trước!', 'err'); return; }
  const defaults = {
    cam:    { type:'cam',    x:5,  y:5,  w:40, h:40, r:8,  opacity:100, visible:true, label:'Camera 1', obsSource:'Camera 1' },
    text:   { type:'text',  x:5,  y:75, w:50, h:15, r:0,  opacity:95,  visible:true, label:'Lower Third', primary:'Tiêu Đề', secondary:'Phụ đề', color:'#a855f7', textColor:'#fff', fontSize:14, bold:true, bgBlur:8 },
    image:  { type:'image', x:30, y:30, w:40, h:30, r:4,  opacity:100, visible:true, label:'Hình ảnh', src:'' },
    shape:  { type:'shape', x:10, y:10, w:30, h:20, r:4,  opacity:80,  visible:true, label:'Shape', fill:'rgba(168,85,247,0.2)', border:true, borderW:1, borderColor:'#a855f7' },
    widget: { type:'widget',x:5,  y:60, w:40, h:20, r:4,  opacity:100, visible:true, label:'Widget', widgetId:'', icon:'🧩' },
  };
  const el = { id: genId(), ...defaults[type] };
  S.elements.push(el);
  S.dirty = true;
  selectEl(el.id);
  renderLayerList();
  pushHistory();
}

// ─── Layer List ────────────────────────────────────
function renderLayerList() {
  const list = $('layer-list');
  if (!S.elements.length) {
    list.innerHTML = '<div style="padding:8px;text-align:center;font-size:8px;color:var(--t4);font-family:var(--fm)">Chưa có layer</div>';
    return;
  }
  const typeIcon = { cam:'📹', text:'Tt', image:'🖼', shape:'■', widget:'🧩' };
  list.innerHTML = S.elements.slice().reverse().map(el => `
    <div class="layer-item ${el.id === S.selectedId ? 'selected' : ''}" data-lid="${el.id}">
      <div class="layer-thumb ${el.type}">${typeIcon[el.type]||'?'}</div>
      <span class="layer-name">${el.label || el.type}</span>
      <div class="layer-ctrls">
        <button class="lc-btn ${el.visible?'active':''}" data-vis="${el.id}" title="Ẩn/hiện"><span class="ms">${el.visible?'visibility':'visibility_off'}</span></button>
        <button class="lc-btn" data-del="${el.id}" title="Xóa" style="color:var(--r)"><span class="ms">close</span></button>
      </div>
    </div>`).join('');

  list.querySelectorAll('.layer-item').forEach(el => {
    el.addEventListener('click', e => { if (e.target.closest('button')) return; selectEl(el.dataset.lid); });
  });
  list.querySelectorAll('[data-vis]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); const el = S.elements.find(x => x.id === btn.dataset.vis); if (el) { el.visible = !el.visible; S.dirty = true; renderCanvas(); renderLayerList(); } });
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteEl(btn.dataset.del); });
  });
}

function deleteEl(id) {
  S.elements = S.elements.filter(x => x.id !== id);
  if (S.selectedId === id) { S.selectedId = null; renderProps(); }
  S.dirty = true;
  renderCanvas();
  renderLayerList();
  pushHistory();
}

// ─── Props Panel ───────────────────────────────────
function renderProps() {
  const empty = $('rp-empty');
  const props = $('rp-props');
  const el = S.elements.find(x => x.id === S.selectedId);
  if (!el) {
    empty.style.display = 'flex'; props.style.display = 'none'; return;
  }
  empty.style.display = 'none'; props.style.display = 'block';

  const typeLabel = { cam:'Camera', text:'Text', image:'Hình ảnh', shape:'Shape', widget:'Widget' };
  const typeIcon  = { cam:'📹', text:'Tt', image:'🖼', shape:'■', widget:'🧩' };

  props.innerHTML = `
    <div class="prop-hdr">
      <span class="prop-hdr-icon">${typeIcon[el.type]||'?'}</span>
      <span class="prop-hdr-title">${el.label || el.type}</span>
      <span class="prop-hdr-type">${typeLabel[el.type]||el.type}</span>
    </div>
    <div class="prop-body" id="prop-body">
      ${renderPropsForType(el)}
    </div>`;

  bindPropEvents(el);
}

function renderPropsForType(el) {
  const posBlock = `
    <div class="pg">
      <div class="pg-title">Vị trí &amp; Kích thước (%)</div>
      <div class="pos-grid">
        <div class="pos-item"><span class="pl">X</span><input class="pi small" data-prop="x" type="number" step="0.1" value="${el.x}"></div>
        <div class="pos-item"><span class="pl">Y</span><input class="pi small" data-prop="y" type="number" step="0.1" value="${el.y}"></div>
        <div class="pos-item"><span class="pl">W</span><input class="pi small" data-prop="w" type="number" step="0.1" value="${el.w}"></div>
        <div class="pos-item"><span class="pl">H</span><input class="pi small" data-prop="h" type="number" step="0.1" value="${el.h}"></div>
        <div class="pos-item"><span class="pl">R</span><input class="pi small" data-prop="r" type="number" step="1" value="${el.r||0}"></div>
      </div>
    </div>
    <div class="pg">
      <div class="pg-title">Opacity</div>
      <div class="pf-range">
        <input class="pi-range" type="range" min="0" max="100" value="${el.opacity??100}" data-prop="opacity">
        <span class="range-val" id="rv-opacity">${el.opacity??100}%</span>
      </div>
    </div>`;

  if (el.type === 'cam') return `
    ${posBlock}
    <div class="pg">
      <div class="pg-title">Camera OBS</div>
      <div class="pf"><label class="pl">Tên nguồn OBS</label><input class="pi" data-prop="obsSource" type="text" placeholder="Camera 1" value="${el.obsSource||''}"></div>
      <div class="pf"><label class="pl">Nhãn hiển thị</label><input class="pi" data-prop="label" type="text" value="${el.label||''}"></div>
    </div>
    <div class="pg">
      <div class="pg-title">Actions</div>
      <div class="pa-row">
        <button class="pa-btn danger" id="pa-del"><span class="ms">delete</span>Xóa</button>
      </div>
    </div>`;

  if (el.type === 'text') return `
    ${posBlock}
    <div class="pg">
      <div class="pg-title">Nội dung văn bản</div>
      <div class="pf"><label class="pl">Dòng chính (Primary)</label><input class="pi" data-prop="primary" type="text" value="${el.primary||''}"></div>
      <div class="pf"><label class="pl">Dòng phụ (Secondary)</label><input class="pi" data-prop="secondary" type="text" value="${el.secondary||''}"></div>
      <div class="pf"><label class="pl">Nhãn layer</label><input class="pi" data-prop="label" type="text" value="${el.label||''}"></div>
    </div>
    <div class="pg">
      <div class="pg-title">Kiểu chữ</div>
      <div class="pf row">
        <label class="pl" style="width:60px">Cỡ chữ</label>
        <input class="pi small" data-prop="fontSize" type="number" min="6" max="80" value="${el.fontSize||14}">
      </div>
      <div class="pf row">
        <label class="pl" style="width:60px">Màu chữ</label>
        <input class="pi color-pi" data-prop="textColor" type="color" value="${el.textColor||'#ffffff'}">
        <label class="pl" style="width:50px;margin-left:4px">Màu nhấn</label>
        <input class="pi color-pi" data-prop="color" type="color" value="${el.color||'#a855f7'}">
      </div>
      <div class="pf row">
        <label class="pl" style="width:60px">Blur nền</label>
        <input class="pi-range" type="range" style="flex:1" min="0" max="30" value="${el.bgBlur||0}" data-prop="bgBlur">
        <span class="range-val" id="rv-bgBlur">${el.bgBlur||0}px</span>
      </div>
    </div>
    <div class="pg">
      <div class="pg-title">Actions</div>
      <div class="pa-row"><button class="pa-btn danger" id="pa-del"><span class="ms">delete</span>Xóa</button></div>
    </div>`;

  if (el.type === 'image') return `
    ${posBlock}
    <div class="pg">
      <div class="pg-title">Hình ảnh</div>
      <div class="img-pick-area" id="img-pick-area">
        <input type="file" accept="image/*" id="img-file-input">
        <span class="img-pick-icon">🖼</span>
        <span class="img-pick-text">Click để chọn hình<br>hoặc kéo thả vào đây</span>
        ${el.src ? `<img src="${el.src}" class="img-preview">` : ''}
      </div>
      <div class="pf" style="margin-top:6px"><label class="pl">Hoặc nhập URL</label><input class="pi" data-prop="src" type="url" placeholder="https://..." value="${el.src||''}"></div>
      <div class="pf"><label class="pl">Nhãn layer</label><input class="pi" data-prop="label" type="text" value="${el.label||''}"></div>
    </div>
    <div class="pg"><div class="pa-row"><button class="pa-btn danger" id="pa-del"><span class="ms">delete</span>Xóa</button></div></div>`;

  if (el.type === 'shape') return `
    ${posBlock}
    <div class="pg">
      <div class="pg-title">Shape</div>
      <div class="pf row">
        <label class="pl" style="width:60px">Màu nền</label>
        <input class="pi color-pi" data-prop="fill" type="color" value="${(el.fill||'#a855f7').replace(/rgba?\([^)]+\)/,()=>rgbaToHex(el.fill)||'#a855f7')}">
      </div>
      <div class="pf row">
        <label class="pl" style="width:60px">Viền</label>
        <input class="pi color-pi" data-prop="borderColor" type="color" value="${el.borderColor||'#a855f7'}">
        <input class="pi small" data-prop="borderW" type="number" min="0" max="20" value="${el.borderW||1}" style="margin-left:4px">
      </div>
      <div class="pf"><label class="pl">Nhãn layer</label><input class="pi" data-prop="label" type="text" value="${el.label||''}"></div>
    </div>
    <div class="pg"><div class="pa-row"><button class="pa-btn danger" id="pa-del"><span class="ms">delete</span>Xóa</button></div></div>`;

  if (el.type === 'widget') return `
    ${posBlock}
    <div class="pg">
      <div class="pg-title">Chọn Widget</div>
      <div class="widget-pick-list" id="widget-pick-list">
        ${S.widgets.map(w => `
          <div class="wpl-item ${w.id === el.widgetId ? 'selected' : ''}" data-wid="${w.id}">
            <span class="wpl-item-icon">${w.icon||'🧩'}</span>
            <span class="wpl-item-name">${w.name}</span>
            <span class="wpl-item-cat">${w.category||'?'}</span>
          </div>`).join('')}
      </div>
      <div class="pf" style="margin-top:6px"><label class="pl">Nhãn layer</label><input class="pi" data-prop="label" type="text" value="${el.label||''}"></div>
    </div>
    <div class="pg"><div class="pa-row"><button class="pa-btn danger" id="pa-del"><span class="ms">delete</span>Xóa</button></div></div>`;

  return posBlock;
}

function bindPropEvents(el) {
  // All data-prop inputs
  document.querySelectorAll('#prop-body [data-prop]').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.prop;
      const val = inp.type === 'number' ? parseFloat(inp.value) : inp.value;
      el[key] = isNaN(val) && inp.type === 'number' ? 0 : val;
      S.dirty = true;
      // Update range readout
      if (key === 'opacity') { const rv = $('rv-opacity'); if (rv) rv.textContent = Math.round(val) + '%'; }
      if (key === 'bgBlur')  { const rv = $('rv-bgBlur');  if (rv) rv.textContent = Math.round(val) + 'px'; }
      renderCanvas();
    });
    inp.addEventListener('change', () => pushHistory());
  });

  // Delete button
  $('pa-del')?.addEventListener('click', () => deleteEl(el.id));

  // Image file picker
  $('img-file-input')?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      el.src = ev.target.result;
      S.dirty = true;
      renderCanvas();
      renderProps();
      pushHistory();
    };
    reader.readAsDataURL(file);
  });

  // Widget picker
  document.querySelectorAll('.wpl-item').forEach(item => {
    item.addEventListener('click', () => {
      const w = S.widgets.find(x => x.id === item.dataset.wid);
      if (!w) return;
      el.widgetId = w.id;
      el.icon = w.icon || '🧩';
      el.label = el.label || w.name;
      S.dirty = true;
      renderCanvas();
      renderProps();
      pushHistory();
    });
  });
}

function updatePosInProps(el) {
  ['x','y','w','h','r'].forEach(k => {
    const inp = document.querySelector(`#prop-body [data-prop="${k}"]`);
    if (inp) inp.value = el[k];
  });
}

// ─── History ───────────────────────────────────────
function pushHistory() {
  S.history = S.history.slice(0, S.histIdx + 1);
  S.history.push(JSON.stringify(S.elements));
  if (S.history.length > 30) S.history.shift();
  S.histIdx = S.history.length - 1;
}

function undo() {
  if (S.histIdx > 0) { S.histIdx--; S.elements = JSON.parse(S.history[S.histIdx]); renderCanvas(); renderLayerList(); renderProps(); }
}
function redo() {
  if (S.histIdx < S.history.length - 1) { S.histIdx++; S.elements = JSON.parse(S.history[S.histIdx]); renderCanvas(); renderLayerList(); renderProps(); }
}

// ─── Modals ────────────────────────────────────────
function openM(id) { $(id).classList.add('open'); }
function closeM(id) { $(id).classList.remove('open'); }

// ─── Bind All ──────────────────────────────────────
function bindAll() {
  $('btn-save').addEventListener('click', saveAll);
  $('btn-undo').addEventListener('click', undo);
  $('btn-redo').addEventListener('click', redo);
  $('btn-del-el').addEventListener('click', () => { if (S.selectedId) deleteEl(S.selectedId); });

  $('btn-add-cam').addEventListener('click', () => addElement('cam'));
  $('btn-add-text').addEventListener('click', () => addElement('text'));
  $('btn-add-img').addEventListener('click', () => addElement('image'));
  $('btn-add-shape').addEventListener('click', () => addElement('shape'));
  $('btn-add-widget').addEventListener('click', () => addElement('widget'));

  // New scene type
  $('btn-new-st').addEventListener('click', () => openM('m-st'));
  $('m-st-ok').addEventListener('click', () => {
    const name = $('m-st-name').value.trim();
    if (!name) { toast('Nhập tên!', 'err'); return; }
    const id = 'st-' + Math.random().toString(36).slice(2,7);
    S.sceneTypes[id] = { id, label: name, icon: $('m-st-icon').value||'🎬', color: $('m-st-color').value||'#a855f7', overlays: [] };
    S.dirty = true;
    renderStList();
    selectSt(id);
    closeM('m-st');
    $('m-st-name').value = '';
    toast(`Đã tạo "${name}" ✓`, 'ok');
  });

  // New overlay
  $('btn-new-ov').addEventListener('click', () => {
    if (!S.activeStId) { toast('Chọn scene type trước!', 'err'); return; }
    openM('m-ov');
  });
  $('m-ov-ok').addEventListener('click', () => {
    const name = $('m-ov-name').value.trim();
    if (!name) { toast('Nhập tên!', 'err'); return; }
    const st = S.sceneTypes[S.activeStId];
    if (!st) return;
    const id = 'ov-' + Math.random().toString(36).slice(2,7);
    if (!st.overlays) st.overlays = [];
    st.overlays.push({ id, label: name, icon: $('m-ov-icon').value||'🔲', elements: [] });
    S.dirty = true;
    renderStList();
    renderOvTabs();
    selectOv(id);
    closeM('m-ov');
    $('m-ov-name').value = '';
    toast(`Đã tạo overlay "${name}" ✓`, 'ok');
  });

  // Close modals on bg click
  ['m-st','m-ov'].forEach(id => {
    $(id).addEventListener('click', e => { if (e.target === $(id)) closeM(id); });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select')) return;
    if ((e.ctrlKey||e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 's') { e.preventDefault(); saveAll(); }
    if (e.key === 'Delete' || e.key === 'Backspace') { if (S.selectedId) { e.preventDefault(); deleteEl(S.selectedId); } }
  });
}

// ─── Utils ─────────────────────────────────────────
function rgbaToHex(s) {
  if (!s || s.startsWith('#')) return s;
  const m = s.match(/[\d.]+/g);
  if (!m) return '#a855f7';
  return '#' + [m[0],m[1],m[2]].map(x => parseInt(x).toString(16).padStart(2,'0')).join('');
}

function toast(msg, type='inf') {
  const box = $('toast-box');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  box.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 2200);
}
</script>
<script src="/OBSChurch/monitor-pip.js"></script>
</body>
