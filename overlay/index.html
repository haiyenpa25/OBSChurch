<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>OBSChurch — Overlay Source</title>
  <link rel="stylesheet" href="overlay.css" />
  <style>
    /* ── Template: Clean Dark ────────────────────────── */
    .tpl-clean-dark {
      background: linear-gradient(to right, rgba(10,10,10,0.95), rgba(10,10,10,0.75));
      border-left: 5px solid #4d8eff;
      padding: 20px 32px;
      border-radius: 0 8px 8px 0;
      backdrop-filter: blur(12px);
    }
    .tpl-clean-dark .lt-primary   { color: #ffffff; }
    .tpl-clean-dark .lt-secondary { color: #adc6ff; text-transform: uppercase; letter-spacing: 0.08em; font-size: 20px; }

    /* ── Template: Vintage ───────────────────────────── */
    .tpl-vintage {
      background: linear-gradient(to right, rgba(60,30,5,0.92), rgba(40,20,3,0.7));
      border-left: 5px solid #ffb95f;
      border-top: 1px solid rgba(255,185,95,0.3);
      padding: 20px 32px;
      border-radius: 0 8px 8px 0;
    }
    .tpl-vintage .lt-primary   { color: #ffddb8; font-style: italic; }
    .tpl-vintage .lt-secondary { color: #ffb95f; font-size: 19px; }

    /* ── Template: SciFi ─────────────────────────────── */
    .tpl-scifi {
      background: linear-gradient(to right, rgba(0,20,40,0.95), rgba(0,15,30,0.8));
      border-left: 5px solid #4edea3;
      padding: 20px 32px;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    }
    .tpl-scifi .lt-primary   { color: #4edea3; font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
    .tpl-scifi .lt-secondary { color: rgba(78,222,163,0.7); font-family: 'JetBrains Mono', monospace; font-size: 18px; }
    .tpl-scifi::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(78,222,163,0.03) 0px, rgba(78,222,163,0.03) 1px, transparent 1px, transparent 4px);
      pointer-events: none;
    }

    /* ── Template: Glassmorphism ─────────────────────── */
    .tpl-glassmorphism {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      padding: 22px 32px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .tpl-glassmorphism .lt-primary   { color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .tpl-glassmorphism .lt-secondary { color: rgba(255,255,255,0.7); font-size: 20px; }

    /* ── Template: Sermon Topic ──────────────────────── */
    .tpl-sermon-topic {
      background: linear-gradient(135deg, rgba(30,10,60,0.95) 0%, rgba(15,10,35,0.85) 100%);
      border: 1px solid rgba(168,85,247,0.3);
      border-left: 6px solid #a855f7;
      padding: 24px 40px;
      border-radius: 8px;
      backdrop-filter: blur(12px);
      text-align: center;
      max-width: 1000px;
      margin: 0 auto;
    }
    .tpl-sermon-topic .lt-primary { color: #f3e8ff; font-size: 46px; font-weight: 800; letter-spacing: 0.02em; }
    .tpl-sermon-topic .lt-secondary { color: #d8b4fe; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; }

    /* ── Template: Scripture Fullscreen ────────────────── */
    .tpl-scripture-fullscreen {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(25px);
      padding: 40px 48px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      text-align: justify;
    }
    .tpl-scripture-fullscreen .lt-primary {
      color: #ffffff;
      font-size: 38px;
      font-weight: 500;
      line-height: 1.6;
      font-family: 'Noto Sans', sans-serif;
    }
    .tpl-scripture-fullscreen .lt-secondary {
      color: #06b6d4;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 16px;
      display: block;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="overlay-root">
    <!-- Camera Frame -->
    <div id="cam-frame" class="cam-frame"></div>
    <!-- Lower Third Container -->
    <div id="lower-third" class="lower-third">
      <span class="lt-primary"  id="lt-primary">—</span>
      <span class="lt-secondary" id="lt-secondary"></span>
    </div>
  </div>

  <script>
    /**
     * OBS Browser Source — Overlay Renderer
     *
     * Lắng nghe WS messages từ server và cập nhật DOM overlay.
     * Không import module vì OBS đôi khi giới hạn ES module.
     */

    // ─── Constants ────────────────────────────────────
    const WS_URL       = 'ws://localhost:3000';
    const RECONNECT_MS = 3000;
    const TEMPLATE_MAP = Object.freeze({
      'clean-dark'          : 'tpl-clean-dark',
      'vintage'             : 'tpl-vintage',
      'scifi'               : 'tpl-scifi',
      'glassmorphism'       : 'tpl-glassmorphism',
      'sermon-topic'        : 'tpl-sermon-topic',
      'scripture-fullscreen': 'tpl-scripture-fullscreen',
    });

    // ─── DOM refs ─────────────────────────────────────
    const lowerThird  = document.getElementById('lower-third');
    const camFrame    = document.getElementById('cam-frame');
    const ltPrimary   = document.getElementById('lt-primary');
    const ltSecondary = document.getElementById('lt-secondary');

    // ─── WebSocket ────────────────────────────────────
    let ws;
    let lastPayload = null;

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.addEventListener('open',    onOpen);
      ws.addEventListener('message', onMessage);
      ws.addEventListener('close',   () => setTimeout(connect, RECONNECT_MS));
      ws.addEventListener('error',   () => ws.close());
    }

    function onOpen() {
      console.log('[Overlay] WS connected');
    }

    function onMessage(event) {
      try {
        const msg = JSON.parse(event.data);
        dispatch(msg);
      } catch(e) {
        console.error('[Overlay] Parse error:', e);
      }
    }

    // ─── Dispatcher (Polymorphic via map) ─────────────
    const handlers = {
      OVERLAY_SHOW : (p) => showOverlay(p),
      OVERLAY_HIDE : ()  => hideOverlay(),
      OVERLAY_TRANS: (p) => triggerTransition(p.effect),
      CLEAR_ALL    : ()  => hideOverlay(),
      SAFETY_CUT   : ()  => hideOverlay(true),
      STATE_SYNC   : (p) => { if (p.overlayVisible) showOverlay(p.currentPayload); },
    };

    function dispatch(msg) {
      const handler = handlers[msg.type];
      if (handler) handler(msg.payload ?? {});
      else console.warn('[Overlay] Unknown message:', msg.type);
    }

    // ─── Overlay Actions ──────────────────────────────
    function showOverlay(payload) {
      lastPayload = payload;
      const templateClass = TEMPLATE_MAP[payload.templateId] ?? TEMPLATE_MAP['clean-dark'];

      // Reset template classes
      Object.values(TEMPLATE_MAP).forEach((c) => lowerThird.classList.remove(c));
      lowerThird.classList.add(templateClass);

      // Cập nhật nội dung
      ltPrimary.textContent   = _getPrimaryText(payload);
      ltSecondary.textContent = _getSecondaryText(payload);

      // Cập nhật vị trí & kích thước khung camera ảo
      if (camFrame) {
        if (payload.camW > 0 && payload.camH > 0) {
          camFrame.style.left         = `${payload.camX}%`;
          camFrame.style.top          = `${payload.camY}%`;
          camFrame.style.width        = `${payload.camW}%`;
          camFrame.style.height       = `${payload.camH}%`;
          camFrame.style.borderRadius = `${payload.camR}px`;
          camFrame.classList.add('is-visible');
        } else {
          camFrame.classList.remove('is-visible');
        }
      }

      // Cập nhật vị trí khung Chữ (trừ khi là template Kinh Thánh toàn màn hình)
      if (payload.templateId !== 'scripture-fullscreen') {
        lowerThird.style.left   = `${payload.textX}%`;
        lowerThird.style.top    = `${payload.textY}%`;
        lowerThird.style.bottom = 'auto';
        lowerThird.style.right  = 'auto';
      } else {
        lowerThird.style.left   = '';
        lowerThird.style.top    = '';
        lowerThird.style.bottom = '';
        lowerThird.style.right  = '';
      }

      // Inject Custom CSS
      let styleTag = document.getElementById('obs-custom-style');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'obs-custom-style';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = payload.customCss || '';

      // Animate in
      lowerThird.classList.remove('is-hiding');
      lowerThird.classList.add('is-visible');
    }

    function hideOverlay(immediate = false) {
      if (immediate) {
        lowerThird.classList.remove('is-visible', 'is-hiding');
        if (camFrame) camFrame.classList.remove('is-visible');
        return;
      }
      lowerThird.classList.add('is-hiding');
      if (camFrame) camFrame.classList.remove('is-visible');
      lowerThird.addEventListener('transitionend', () => {
        lowerThird.classList.remove('is-visible', 'is-hiding');
      }, { once: true });
    }

    function triggerTransition(effect) {
      lowerThird.classList.add('is-hiding');
      if (camFrame) camFrame.classList.remove('is-visible');
      setTimeout(() => {
        lowerThird.classList.remove('is-hiding');
        lowerThird.classList.add('is-visible');
        if (camFrame && lastPayload && lastPayload.camW > 0 && lastPayload.camH > 0) {
          camFrame.classList.add('is-visible');
        }
      }, 350);
    }


    // ─── Text Helpers ─────────────────────────────────
    function _getPrimaryText(p) {
      return p.songName || p.speakerName || p.announcement || p.scriptureRef || '—';
    }

    function _getSecondaryText(p) {
      if (p.scriptureRef) {
        return p.scriptureVerse ? `${p.scriptureRef}:${p.scriptureVerse}` : p.scriptureRef;
      }
      return p.speakerName || '';
    }

    // ─── Start ────────────────────────────────────────
    connect();
  </script>
</body>
</html>
