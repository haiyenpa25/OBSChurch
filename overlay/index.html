<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>OBSChurch — Overlay Source</title>
  <link rel="stylesheet" href="overlay.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ── Template: Clean Dark ────────────────────────── */
    .tpl-clean-dark {
      background: linear-gradient(to right, rgba(10,10,10,0.95), rgba(10,10,10,0.75));
      border-left: 5px solid #4d8eff;
      padding: 20px 32px;
      border-radius: 0 8px 8px 0;
      backdrop-filter: blur(12px);
    }
    .tpl-clean-dark .lt-primary   { color: #ffffff; }
    .tpl-clean-dark .lt-secondary { color: #adc6ff; text-transform: uppercase; letter-spacing: 0.08em; font-size: 20px; }

    /* ── Template: Vintage ───────────────────────────── */
    .tpl-vintage {
      background: linear-gradient(to right, rgba(60,30,5,0.92), rgba(40,20,3,0.7));
      border-left: 5px solid #ffb95f;
      border-top: 1px solid rgba(255,185,95,0.3);
      padding: 20px 32px;
      border-radius: 0 8px 8px 0;
    }
    .tpl-vintage .lt-primary   { color: #ffddb8; font-style: italic; }
    .tpl-vintage .lt-secondary { color: #ffb95f; font-size: 19px; }

    /* ── Template: SciFi ─────────────────────────────── */
    .tpl-scifi {
      background: linear-gradient(to right, rgba(0,20,40,0.95), rgba(0,15,30,0.8));
      border-left: 5px solid #4edea3;
      padding: 20px 32px;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    }
    .tpl-scifi .lt-primary   { color: #4edea3; font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
    .tpl-scifi .lt-secondary { color: rgba(78,222,163,0.7); font-family: 'JetBrains Mono', monospace; font-size: 18px; }
    .tpl-scifi::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(78,222,163,0.03) 0px, rgba(78,222,163,0.03) 1px, transparent 1px, transparent 4px);
      pointer-events: none;
    }

    /* ── Template: Glassmorphism ─────────────────────── */
    .tpl-glassmorphism {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      padding: 22px 32px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .tpl-glassmorphism .lt-primary   { color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .tpl-glassmorphism .lt-secondary { color: rgba(255,255,255,0.7); font-size: 20px; }

    /* ── Template: Sermon Topic ──────────────────────── */
    .tpl-sermon-topic {
      background: linear-gradient(135deg, rgba(30,10,60,0.95) 0%, rgba(15,10,35,0.85) 100%);
      border: 1px solid rgba(168,85,247,0.3);
      border-left: 6px solid #a855f7;
      padding: 24px 40px;
      border-radius: 8px;
      backdrop-filter: blur(12px);
      text-align: center;
      max-width: 1000px;
      margin: 0 auto;
    }
    .tpl-sermon-topic .lt-primary { color: #f3e8ff; font-size: 46px; font-weight: 800; letter-spacing: 0.02em; }
    .tpl-sermon-topic .lt-secondary { color: #d8b4fe; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; }

    /* ── Template: Scripture Fullscreen ────────────────── */
    .tpl-scripture-fullscreen {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(25px);
      padding: 40px 48px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      text-align: justify;
    }
    .tpl-scripture-fullscreen .lt-primary {
      color: #ffffff;
      font-size: 38px;
      font-weight: 500;
      line-height: 1.6;
    }
    .tpl-scripture-fullscreen .lt-secondary {
      color: #06b6d4;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 16px;
      display: block;
      text-align: right;
    }

    /* ── Widget Layer Container ──────────────────────── */
    #widget-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .widget-frame {
      position: absolute;
      border: none;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="overlay-root">
    <!-- Camera Frame -->
    <div id="cam-frame" class="cam-frame"></div>
    <!-- Lower Third Container -->
    <div id="lower-third" class="lower-third">
      <span class="lt-primary"  id="lt-primary">—</span>
      <span class="lt-secondary" id="lt-secondary"></span>
    </div>
  </div>

  <!-- Widget iframe layer — mỗi widget là 1 iframe riêng -->
  <div id="widget-layer"></div>

  <script>
    /**
     * OBS Browser Source — Overlay Renderer v2.1
     *
     * Nhận WS messages từ server:
     *  - OVERLAY_SHOW  : hiện lower-third overlay
     *  - OVERLAY_HIDE  : ẩn overlay
     *  - OVERLAY_TRANS : transition animation
     *  - OVERLAY_SWITCH: chuyển layout (layers + widgets)
     *  - WIDGET_UPDATE : cập nhật props một widget cụ thể
     *  - CLEAR_ALL     : xóa tất cả
     *  - SAFETY_CUT    : tắt ngay lập tức
     *  - STATE_SYNC    : đồng bộ khi mới kết nối
     */

    const WS_URL       = 'ws://localhost:3000';
    const RECONNECT_MS = 3000;
    const BASE_URL     = 'http://localhost/OBSChurch';

    const TEMPLATE_MAP = Object.freeze({
      'clean-dark'          : 'tpl-clean-dark',
      'vintage'             : 'tpl-vintage',
      'scifi'               : 'tpl-scifi',
      'glassmorphism'       : 'tpl-glassmorphism',
      'sermon-topic'        : 'tpl-sermon-topic',
      'scripture-fullscreen': 'tpl-scripture-fullscreen',
    });

    // DOM refs
    const lowerThird  = document.getElementById('lower-third');
    const camFrame    = document.getElementById('cam-frame');
    const ltPrimary   = document.getElementById('lt-primary');
    const ltSecondary = document.getElementById('lt-secondary');
    const widgetLayer = document.getElementById('widget-layer');

    // Active widget iframes: { widgetId: HTMLIFrameElement }
    const activeWidgets = {};

    let ws;
    let lastPayload = null;

    // ─── WebSocket ────────────────────────────────────
    function connect() {
      ws = new WebSocket(WS_URL);
      ws.addEventListener('open',    onOpen);
      ws.addEventListener('message', onMessage);
      ws.addEventListener('close',   () => setTimeout(connect, RECONNECT_MS));
      ws.addEventListener('error',   () => ws.close());
    }

    function onOpen() {
      console.log('[Overlay] WS connected');
    }

    function onMessage(event) {
      try {
        const msg = JSON.parse(event.data);
        dispatch(msg);
      } catch(e) {
        console.error('[Overlay] Parse error:', e);
      }
    }

    // ─── Dispatcher ───────────────────────────────────
    const handlers = {
      OVERLAY_SHOW  : (p) => showOverlay(p),
      OVERLAY_HIDE  : ()  => hideOverlay(),
      OVERLAY_TRANS : (p) => triggerTransition(p.effect),
      OVERLAY_SWITCH: (p) => switchOverlayLayout(p),
      WIDGET_UPDATE : (p) => updateWidgetProps(p.widgetId, p.props),
      CLEAR_ALL     : ()  => { hideOverlay(); clearWidgets(); },
      SAFETY_CUT    : ()  => { hideOverlay(true); clearWidgets(); },
      STATE_SYNC    : (p) => {
        if (p.overlayVisible) showOverlay(p.currentPayload);
      },
    };

    function dispatch(msg) {
      const handler = handlers[msg.type];
      if (handler) handler(msg.payload ?? {});
      else console.warn('[Overlay] Unknown message:', msg.type);
    }

    // ─── Overlay Actions ──────────────────────────────
    function showOverlay(payload) {
      lastPayload = payload;
      const templateClass = TEMPLATE_MAP[payload.templateId] ?? TEMPLATE_MAP['clean-dark'];

      Object.values(TEMPLATE_MAP).forEach((c) => lowerThird.classList.remove(c));
      lowerThird.classList.add(templateClass);

      ltPrimary.textContent   = _getPrimaryText(payload);
      ltSecondary.textContent = _getSecondaryText(payload);

      if (camFrame) {
        if (payload.camW > 0 && payload.camH > 0) {
          camFrame.style.left         = `${payload.camX}%`;
          camFrame.style.top          = `${payload.camY}%`;
          camFrame.style.width        = `${payload.camW}%`;
          camFrame.style.height       = `${payload.camH}%`;
          camFrame.style.borderRadius = `${payload.camR}px`;
          camFrame.classList.add('is-visible');
        } else {
          camFrame.classList.remove('is-visible');
        }
      }

      if (payload.templateId !== 'scripture-fullscreen') {
        lowerThird.style.left   = `${payload.textX ?? 5}%`;
        lowerThird.style.top    = `${payload.textY ?? 80}%`;
        lowerThird.style.bottom = 'auto';
        lowerThird.style.right  = 'auto';
      } else {
        lowerThird.style.left = lowerThird.style.top = '';
        lowerThird.style.bottom = lowerThird.style.right = '';
      }

      let styleTag = document.getElementById('obs-custom-style');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'obs-custom-style';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = payload.customCss || '';

      lowerThird.classList.remove('is-hiding');
      lowerThird.classList.add('is-visible');
    }

    function hideOverlay(immediate = false) {
      if (immediate) {
        lowerThird.classList.remove('is-visible', 'is-hiding');
        if (camFrame) camFrame.classList.remove('is-visible');
        return;
      }
      lowerThird.classList.add('is-hiding');
      if (camFrame) camFrame.classList.remove('is-visible');
      lowerThird.addEventListener('transitionend', () => {
        lowerThird.classList.remove('is-visible', 'is-hiding');
      }, { once: true });
    }

    function triggerTransition(effect) {
      lowerThird.classList.add('is-hiding');
      if (camFrame) camFrame.classList.remove('is-visible');
      setTimeout(() => {
        lowerThird.classList.remove('is-hiding');
        lowerThird.classList.add('is-visible');
        if (camFrame && lastPayload && lastPayload.camW > 0) {
          camFrame.classList.add('is-visible');
        }
      }, 350);
    }

    // ─── Overlay Switch (từ Scene Designer layers) ────
    function switchOverlayLayout(payload) {
      /**
       * payload: {
       *   sceneTypeId, overlayId, overlayLabel,
       *   layers: [ { inputId, x, y, w, h, r, opacity, visible } ]
       *   elements: [ { id, type, x, y, w, h, r, opacity, visible, widgetId, ... } ]
       * }
       * Hỗ trợ cả format cũ (layers[]) và mới (elements[])
       */
      const W = window.innerWidth || 1920;
      const H = window.innerHeight || 1080;

      // Format mới: elements[] từ Scene Designer
      const elements = payload.elements || [];
      if (elements.length > 0) {
        clearWidgets();
        elements.forEach(el => {
          if (!el.visible) return;
          if (el.type === 'widget' && el.widgetId) {
            mountWidget(el.widgetId, {
              x: el.x, y: el.y, w: el.w, h: el.h,
              r: el.r || 0, opacity: el.opacity ?? 100,
            }, el.widgetProps || {});
          }
        });
        return;
      }

      // Format cũ: layers[] từ scene-types.json manual
      const layers = payload.layers || [];
      clearWidgets();
      layers.forEach(layer => {
        if (!layer.visible) return;
        // Nếu layer là widget
        if (layer.widgetId) {
          mountWidget(layer.widgetId, {
            x: layer.x, y: layer.y, w: layer.w, h: layer.h,
            r: layer.r || 0, opacity: layer.opacity ?? 100,
          }, layer.props || {});
        }
      });
    }

    // ─── Widget Management ────────────────────────────
    function mountWidget(widgetId, layout, props) {
      // Nếu đã có iframe cho widget này, cập nhật props
      if (activeWidgets[widgetId]) {
        updateWidgetProps(widgetId, props);
        positionWidget(activeWidgets[widgetId], layout);
        return;
      }

      const W = window.innerWidth || 1920;
      const H = window.innerHeight || 1080;

      const iframe = document.createElement('iframe');
      iframe.className = 'widget-frame';
      iframe.src = `${BASE_URL}/widgets/${widgetId}/template.html`;
      iframe.setAttribute('scrolling', 'no');
      iframe.setAttribute('frameborder', '0');
      iframe.style.opacity = (layout.opacity ?? 100) / 100;

      positionWidget(iframe, layout);
      widgetLayer.appendChild(iframe);
      activeWidgets[widgetId] = iframe;

      // Inject props after load
      iframe.addEventListener('load', () => {
        try {
          iframe.contentWindow.__WIDGET_PROPS = props;
          if (typeof iframe.contentWindow.__widgetReload === 'function') {
            iframe.contentWindow.__widgetReload(props);
          }
        } catch(e) {
          console.warn('[Widget] Cross-origin prop inject failed:', e.message);
        }
      });
    }

    function positionWidget(iframe, layout) {
      const W = window.innerWidth || 1920;
      const H = window.innerHeight || 1080;
      iframe.style.left         = (layout.x / 100 * W) + 'px';
      iframe.style.top          = (layout.y / 100 * H) + 'px';
      iframe.style.width        = (layout.w / 100 * W) + 'px';
      iframe.style.height       = (layout.h / 100 * H) + 'px';
      iframe.style.borderRadius = (layout.r || 0) + 'px';
      iframe.style.opacity      = (layout.opacity ?? 100) / 100;
    }

    function updateWidgetProps(widgetId, props) {
      const iframe = activeWidgets[widgetId];
      if (!iframe) return;
      try {
        if (typeof iframe.contentWindow.__widgetReload === 'function') {
          iframe.contentWindow.__widgetReload(props);
        }
      } catch(e) {}
    }

    function clearWidgets() {
      Object.values(activeWidgets).forEach(iframe => iframe.remove());
      Object.keys(activeWidgets).forEach(k => delete activeWidgets[k]);
    }

    // ─── Text Helpers ─────────────────────────────────
    function _getPrimaryText(p) {
      return p.songName || p.speakerName || p.announcement || p.scriptureRef || '—';
    }

    function _getSecondaryText(p) {
      if (p.scriptureRef && p.scriptureVerse) return `${p.scriptureRef} : ${p.scriptureVerse}`;
      if (p.scriptureRef) return p.scriptureRef;
      if (p.speakerName && p.title) return p.title;
      return p.speakerName || p.singerName || '';
    }

    // ─── Start ────────────────────────────────────────
    connect();
  </script>
</body>
</html>
